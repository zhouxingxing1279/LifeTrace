<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>Life trace 正在启动</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          "Microsoft YaHei UI", "PingFang SC", system-ui, -apple-system, sans-serif;
        background: #f4f5f1;
        color: #20241f;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 48% 42%, rgba(77, 112, 82, 0.11), transparent 31rem),
          #f4f5f1;
      }

      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
      }

      .mark {
        width: 68px;
        height: 68px;
        display: grid;
        place-items: center;
        border-radius: 21px;
        color: white;
        font: 700 32px/1 Georgia, serif;
        background: linear-gradient(145deg, #38583f, #6f8c70);
        box-shadow: 0 16px 42px rgba(52, 76, 56, 0.24);
      }

      h1 {
        margin: 0;
        font: 600 24px/1.2 Georgia, "Microsoft YaHei UI", serif;
        letter-spacing: 0.12em;
      }

      p {
        margin: -5px 0 0;
        color: #7b827a;
        font-size: 13px;
      }

      .loader {
        width: 132px;
        height: 3px;
        margin-top: 10px;
        overflow: hidden;
        border-radius: 10px;
        background: #dde1da;
      }

      .loader::after {
        content: "";
        display: block;
        width: 42%;
        height: 100%;
        border-radius: inherit;
        background: #59725c;
        animation: loading 1.15s ease-in-out infinite;
      }

      @keyframes loading {
        from {
          transform: translateX(-110%);
        }
        to {
          transform: translateX(340%);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">LT</div>
      <h1>Life trace</h1>
      <p>正在准备你的个人管理空间</p>
      <div class="loader" aria-label="正在启动"></div>
    </main>
  </body>
</html>
