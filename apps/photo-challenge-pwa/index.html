<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#29382f" />
  <meta name="description" content="LifeTrace 摄影挑战：上传照片并使用 GLM-4V-Flash 评分。" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./styles.css" />
  <title>摄影挑战 · LifeTrace</title>
</head>
<body>
  <main class="shell">
    <section class="card">
      <header class="header">
        <span class="mark" aria-hidden="true">📷</span>
        <div>
          <small>LIFETRACE · PHOTO CHALLENGE</small>
          <h1>拍到 501 张真正优秀的照片</h1>
        </div>
      </header>

      <section class="progress-card" aria-live="polite">
        <div class="progress-title">
          <span>90+ 高分照片</span>
          <strong><b id="high-count">—</b> <small>/ <span id="target-count">501</span></small></strong>
        </div>
        <div class="progress-track"><i id="progress-bar"></i></div>
        <p id="progress-copy">输入挑战口令后显示实时进度</p>
      </section>

      <section id="key-panel" class="key-panel">
        <span class="key-icon" aria-hidden="true">🔑</span>
        <div>
          <strong>挑战口令</strong>
          <p>这不是 LifeTrace 账号密码，只用于这个摄影挑战。</p>
        </div>
        <label>
          <span class="sr-only">挑战口令</span>
          <input id="access-key" type="password" autocomplete="off" placeholder="输入挑战口令" />
        </label>
        <button id="enter-button" type="button">进入挑战</button>
      </section>

      <section id="upload-panel" class="upload-panel" hidden>
        <div class="picker-actions">
          <button id="camera-button" class="picker primary-picker" type="button">
            <span aria-hidden="true">📸</span><b>拍一张照片</b><small>直接调用手机相机</small>
          </button>
          <button id="library-button" class="picker" type="button">
            <span aria-hidden="true">🖼️</span><b>从相册选择</b><small>JPEG、PNG 或 WebP</small>
          </button>
        </div>
        <input id="camera-input" class="hidden-input" type="file" accept="image/jpeg,image/png,image/webp" capture="environment" />
        <input id="library-input" class="hidden-input" type="file" accept="image/jpeg,image/png,image/webp" />

        <div id="preview-wrap" class="preview-wrap" hidden>
          <img id="preview-image" alt="待评分照片预览" />
          <div class="file-row">
            <div><strong id="file-name">照片</strong><small id="file-size"></small></div>
            <button id="clear-button" type="button">重新选择</button>
          </div>
        </div>

        <button id="score-button" class="score-button" type="button" disabled>
          <span id="score-button-icon" aria-hidden="true">✨</span><span id="score-button-label">提交并评分</span>
        </button>
      </section>

      <section id="result-panel" class="result" hidden>
        <div class="score-orb"><strong id="score-value">0</strong><span>/ 100</span></div>
        <div class="result-copy">
          <h2 id="result-title">评分完成</h2>
          <p id="feedback"></p>
          <div class="breakdown">
            <div><span>构图</span><b><em id="score-composition">0</em><small>/25</small></b></div>
            <div><span>光线色彩</span><b><em id="score-light">0</em><small>/20</small></b></div>
            <div><span>主体叙事</span><b><em id="score-story">0</em><small>/20</small></b></div>
            <div><span>技术质量</span><b><em id="score-technical">0</em><small>/20</small></b></div>
            <div><span>原创瞬间</span><b><em id="score-originality">0</em><small>/15</small></b></div>
          </div>
        </div>
      </section>

      <p id="message" class="message" aria-live="polite" hidden></p>
      <footer>严格超过 90 分才计数 · 同一原图不重复计数 · “超过 500 张”按 501 张达成</footer>
    </section>
  </main>
  <script src="./app.js" defer></script>
</body>
</html>
