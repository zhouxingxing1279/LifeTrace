<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f6f4" />
    <meta name="description" content="LifeTrace 个人管理平台 Web 客户端" />
    <script>
      (() => {
        const storageKey = "lifetrace.appearance.theme";
        try {
          const theme = localStorage.getItem(storageKey);
          if (theme !== "light" && theme !== "dark") return;
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          const themeColor = document.querySelector('meta[name="theme-color"]');
          themeColor?.setAttribute("content", theme === "dark" ? "#101613" : "#f4f6f4");
        } catch {
          // Storage can be unavailable in hardened/private browser contexts.
        }
      })();
    </script>
    <style>
      html { background: #f4f6f4; color-scheme: light; }
      html[data-theme="dark"] { background: #101613; color-scheme: dark; }
      body { margin: 0; background: inherit; }
    </style>
    <link rel="icon" href="/favicon.ico" />
    <title>LifeTrace Web</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
