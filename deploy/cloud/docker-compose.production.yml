name: lifetrace-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lifetrace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: lifetrace
    volumes:
      - lifetrace_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifetrace -d lifetrace"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - lifetrace

  lifetrace-migrate:
    image: ${LIFETRACE_CLOUD_IMAGE:-ghcr.io/zhouxingxing1279/lifetrace-cloud:main}
    entrypoint: ["/app/lifetrace-migrate"]
    restart: "no"
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - lifetrace

  lifetrace-cloud:
    image: ${LIFETRACE_CLOUD_IMAGE:-ghcr.io/zhouxingxing1279/lifetrace-cloud:main}
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      LIFETRACE_BIND_ADDRESS: "0.0.0.0:8787"
      MIGRATION_ON_STARTUP: "false"
      PHOTO_STAGING_DIR: "/data/photo-staging"
    volumes:
      - lifetrace_photo_staging:/data/photo-staging
    depends_on:
      postgres:
        condition: service_healthy
      lifetrace-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8787/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - lifetrace

  lifetrace-mail-worker:
    image: ${LIFETRACE_CLOUD_IMAGE:-ghcr.io/zhouxingxing1279/lifetrace-cloud:main}
    entrypoint: ["/app/mail_worker"]
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      MIGRATION_ON_STARTUP: "false"
    depends_on:
      postgres:
        condition: service_healthy
      lifetrace-cloud:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - lifetrace

  lifetrace-execution-worker:
    image: ${LIFETRACE_CLOUD_IMAGE:-ghcr.io/zhouxingxing1279/lifetrace-cloud:main}
    entrypoint: ["/app/execution_worker"]
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      MIGRATION_ON_STARTUP: "false"
    depends_on:
      postgres:
        condition: service_healthy
      lifetrace-cloud:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - lifetrace

  caddy:
    image: ${LIFETRACE_WEB_IMAGE:-ghcr.io/zhouxingxing1279/lifetrace-web:main}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    environment:
      BEECOUNT_DOMAIN: "${BEECOUNT_DOMAIN:-finance.8-148-75-45.sslip.io}"
    depends_on:
      lifetrace-cloud:
        condition: service_healthy
    networks:
      - lifetrace

volumes:
  lifetrace_pgdata:
  lifetrace_photo_staging:
  caddy_data:
  caddy_config:

networks:
  lifetrace:
    name: lifetrace-prod
