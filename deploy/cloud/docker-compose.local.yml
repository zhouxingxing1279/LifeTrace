# Local development: PostgreSQL is pinned, persisted and exposed only on loopback.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lifetrace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lifetrace_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-lifetrace}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - lifetrace_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lifetrace} -d ${POSTGRES_DB:-lifetrace}"]
      interval: 5s
      timeout: 3s
      retries: 10

  lifetrace-cloud:
    profiles: ["cloud"]
    build:
      context: ../..
      dockerfile: services/cloud/Dockerfile
    environment: &cloud_environment
      LIFETRACE_ENV: development
      LIFETRACE_BIND_ADDRESS: 0.0.0.0:8787
      DATABASE_URL: postgres://${POSTGRES_USER:-lifetrace}:${POSTGRES_PASSWORD:-lifetrace_dev_password}@postgres:5432/${POSTGRES_DB:-lifetrace}
      DATABASE_MIN_CONNECTIONS: "2"
      DATABASE_MAX_CONNECTIONS: "10"
      MIGRATION_ON_STARTUP: "true"
      DEV_AUTH_ENABLED: "true"
      AUTH_REGISTRATION_MODE: ${AUTH_REGISTRATION_MODE:-disabled}
      AUTH_PASSWORD_MIN_LENGTH: "${AUTH_PASSWORD_MIN_LENGTH:-9}"
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-lifetrace_session}
      DEV_AUTH_TOKEN: ${DEV_AUTH_TOKEN:-dev-token}
      DEV_AUTH_USER_ID: ${DEV_AUTH_USER_ID:-dev-user}
      DEV_AUTH_DEVICE_ID: ${DEV_AUTH_DEVICE_ID:-dev-device}
      CURSOR_SIGNING_KEY: ${CURSOR_SIGNING_KEY:-dev-cursor-key}
      PAGE_TOKEN_SIGNING_KEY: ${PAGE_TOKEN_SIGNING_KEY:-dev-page-token-key}
      AUTH_PASSWORD_PEPPER: ${AUTH_PASSWORD_PEPPER:-development-password-pepper}
      AUTH_TOKEN_HASH_PEPPER: ${AUTH_TOKEN_HASH_PEPPER:-development-token-pepper}
      MAIL_CREDENTIAL_KEY: ${MAIL_CREDENTIAL_KEY:-bGlmZXRyYWNlLWRldi1tYWlsLWtleS0zMi1ieXRlcyE=}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:1420,http://127.0.0.1:1420,http://tauri.localhost,https://tauri.localhost,http://localhost:4173,http://127.0.0.1:4173,http://localhost:5180,http://127.0.0.1:5180,http://localhost:5190,http://127.0.0.1:5190,http://192.168.3.30:5190}
    ports:
      - "127.0.0.1:${CLOUD_HOST_PORT:-8787}:8787"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8787/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12

  lifetrace-mail-worker:
    profiles: ["cloud"]
    build:
      context: ../..
      dockerfile: services/cloud/Dockerfile
    entrypoint: ["/app/mail_worker"]
    environment:
      <<: *cloud_environment
      MIGRATION_ON_STARTUP: "false"
    depends_on:
      postgres:
        condition: service_healthy
      lifetrace-cloud:
        condition: service_healthy

volumes:
  lifetrace_pgdata:
