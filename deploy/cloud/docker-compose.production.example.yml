# Production example for hosts using an external PostgreSQL database.
# Both Cloud and Web images are built by GitHub Actions and published to GHCR,
# so production hosts only need Docker Compose and environment variables.
services:
  lifetrace-cloud:
    image: ${LIFETRACE_CLOUD_IMAGE:-ghcr.io/zhouxingxing1279/lifetrace-cloud:main}
    environment: &cloud_environment
      LIFETRACE_ENV: production
      LIFETRACE_BIND_ADDRESS: 0.0.0.0:8787
      DATABASE_URL: ${DATABASE_URL}
      MIGRATION_ON_STARTUP: "false"
      CURSOR_SIGNING_KEY: ${CURSOR_SIGNING_KEY}
      PAGE_TOKEN_SIGNING_KEY: ${PAGE_TOKEN_SIGNING_KEY}
      MAIL_CREDENTIAL_KEY: ${MAIL_CREDENTIAL_KEY}
      DEV_AUTH_ENABLED: "false"
      AUTH_PASSWORD_MIN_LENGTH: "${AUTH_PASSWORD_MIN_LENGTH:-9}"
      AUTH_PASSWORD_PEPPER: ${AUTH_PASSWORD_PEPPER}
      AUTH_TOKEN_HASH_PEPPER: ${AUTH_TOKEN_HASH_PEPPER}
      AUTH_COOKIE_SECURE: "true"
      AUTH_RESET_NOTIFIER: ${AUTH_RESET_NOTIFIER:-disabled}
      PUBLIC_WEB_BASE_URL: ${PUBLIC_WEB_BASE_URL:-https://8.148.75.45}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://8.148.75.45}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      BEECOUNT_ATTACHMENT_MAX_UPLOAD_BYTES: ${BEECOUNT_ATTACHMENT_MAX_UPLOAD_BYTES:-67108864}
    restart: unless-stopped

  lifetrace-mail-worker:
    image: ${LIFETRACE_CLOUD_IMAGE:-ghcr.io/zhouxingxing1279/lifetrace-cloud:main}
    entrypoint: ["/app/mail_worker"]
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    environment:
      <<: *cloud_environment
      MIGRATION_ON_STARTUP: "false"
    depends_on:
      - lifetrace-cloud
    restart: unless-stopped

  lifetrace-execution-worker:
    image: ${LIFETRACE_CLOUD_IMAGE:-ghcr.io/zhouxingxing1279/lifetrace-cloud:main}
    entrypoint: ["/app/execution_worker"]
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    environment:
      <<: *cloud_environment
      MIGRATION_ON_STARTUP: "false"
    depends_on:
      - lifetrace-cloud
    restart: unless-stopped

  caddy:
    image: ${LIFETRACE_WEB_IMAGE:-ghcr.io/zhouxingxing1279/lifetrace-web:main}
    ports:
      - "80:80"
      - "443:443"
      - "8869:8869"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - lifetrace-cloud
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
