# Production example. The Cloud image is built by GitHub Actions and published
# to GHCR so production hosts only need to pull and run the image.
services:
  lifetrace-cloud:
    image: ${LIFETRACE_CLOUD_IMAGE:-ghcr.io/zhouxingxing1279/lifetrace-cloud:main}
    environment: &cloud_environment
      LIFETRACE_ENV: production
      LIFETRACE_BIND_ADDRESS: 0.0.0.0:8787
      DATABASE_URL: ${DATABASE_URL}
      MIGRATION_ON_STARTUP: "false"
      CURSOR_SIGNING_KEY: ${CURSOR_SIGNING_KEY}
      PAGE_TOKEN_SIGNING_KEY: ${PAGE_TOKEN_SIGNING_KEY}
      MAIL_CREDENTIAL_KEY: ${MAIL_CREDENTIAL_KEY}
      DEV_AUTH_ENABLED: "false"
      AUTH_PASSWORD_MIN_LENGTH: "${AUTH_PASSWORD_MIN_LENGTH:-9}"
      AUTH_PASSWORD_PEPPER: ${AUTH_PASSWORD_PEPPER}
      AUTH_TOKEN_HASH_PEPPER: ${AUTH_TOKEN_HASH_PEPPER}
      AUTH_COOKIE_SECURE: "true"
      AUTH_RESET_NOTIFIER: ${AUTH_RESET_NOTIFIER:-disabled}
      PUBLIC_WEB_BASE_URL: ${PUBLIC_WEB_BASE_URL}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
    secrets:
      - database_url
    restart: unless-stopped

  lifetrace-mail-worker:
    image: ${LIFETRACE_CLOUD_IMAGE:-ghcr.io/zhouxingxing1279/lifetrace-cloud:main}
    entrypoint: ["/app/mail_worker"]
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    environment:
      <<: *cloud_environment
      MIGRATION_ON_STARTUP: "false"
    secrets:
      - database_url
    depends_on:
      - lifetrace-cloud
    restart: unless-stopped

secrets:
  database_url:
    environment: DATABASE_URL
