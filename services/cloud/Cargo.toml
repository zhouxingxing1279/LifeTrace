[package]
name = "lifetrace-cloud"
version = "0.1.0"
edition = "2021"
description = "LifeTrace EPIC-03 independent cloud sync server (Rust + Axum + PostgreSQL)"
license = "MIT"

[dependencies]
aes-gcm = "0.10"
ammonia = "4.1"
argon2 = { version = "0.5", features = ["std"] }
async-trait = "0.1"
axum = { version = "0.8", features = ["json", "macros", "multipart", "ws"] }
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
hmac = "0.12"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
imap = { version = "3.0.0-alpha.15", default-features = false, features = ["rustls-tls"] }
ipnet = "2"
lettre = { version = "=0.11.22", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }
lifetrace-contracts = { path = "../../crates/lifetrace-contracts" }
mail-parser = { version = "0.11.5", features = ["full_encoding", "serde"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "json", "migrate", "macros"] }
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "request-id", "set-header"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
url = "2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
