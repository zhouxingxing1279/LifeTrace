name: EPIC-05 Apply and Validate

on:
  push:
    branches: [agent/epic-05-windows-sync-core]
    paths: [".github/workflows/epic05-bootstrap.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-test-push:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/epic-05-windows-sync-core
          fetch-depth: 0
      - name: Verify and apply implementation overlays
        shell: bash
        run: |
          set -euo pipefail

          cat .epic05-overlay/chunk-* | base64 -d > /tmp/epic05-overlay.tar.xz
          xz -t /tmp/epic05-overlay.tar.xz
          tar -tJf /tmp/epic05-overlay.tar.xz >/dev/null
          echo "Base overlay: $(sha256sum /tmp/epic05-overlay.tar.xz | cut -d' ' -f1), $(stat -c %s /tmp/epic05-overlay.tar.xz) bytes"
          tar -xJf /tmp/epic05-overlay.tar.xz

          cat .epic05-fix/chunk-* | base64 -d > /tmp/epic05-fix.tar.xz
          echo "Fix overlay: $(sha256sum /tmp/epic05-fix.tar.xz | cut -d' ' -f1), $(stat -c %s /tmp/epic05-fix.tar.xz) bytes"
          xz --ignore-check -dc /tmp/epic05-fix.tar.xz | tar -tf - >/dev/null
          xz --ignore-check -dc /tmp/epic05-fix.tar.xz | tar -xf -
      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Create required bundled dictionary resource
        run: |
          python3 - <<'PY'
          import sqlite3
          from pathlib import Path
          path = Path('xunji_service/data/dictionary.db')
          path.parent.mkdir(parents=True, exist_ok=True)
          with sqlite3.connect(path) as db:
              db.execute('CREATE TABLE IF NOT EXISTS dictionary_meta (key TEXT PRIMARY KEY, value TEXT NOT NULL)')
              db.execute("INSERT OR REPLACE INTO dictionary_meta(key, value) VALUES ('generated_for_ci', 'true')")
          PY
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/lifetrace-contracts
            crates/lifetrace-sync-client
            src-tauri
      - name: Format and resolve lockfiles
        run: |
          cargo fmt --manifest-path crates/lifetrace-sync-client/Cargo.toml
          cargo fmt --manifest-path src-tauri/Cargo.toml
          cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
      - name: Contract tests
        run: cargo test --manifest-path crates/lifetrace-contracts/Cargo.toml
      - name: Pure sync core tests
        run: cargo test --manifest-path crates/lifetrace-sync-client/Cargo.toml --all-features
      - name: Desktop database and adapter tests
        id: desktop-tests
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          cargo test --manifest-path src-tauri/Cargo.toml --lib -- --test-threads=1 2>&1 | tee epic05-desktop-test.log
      - name: Upload desktop test diagnostics
        if: always() && steps.desktop-tests.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: epic05-desktop-test-log
          path: epic05-desktop-test.log
          if-no-files-found: error
          retention-days: 1
      - name: Stop after desktop test failure
        if: steps.desktop-tests.outcome == 'failure'
        run: exit 1
      - name: Clippy pure sync core
        run: cargo clippy --manifest-path crates/lifetrace-sync-client/Cargo.toml --all-targets --all-features -- -D warnings
      - name: Clippy desktop library
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --lib -- -D warnings
      - name: Frontend install and validation
        run: |
          npm ci
          npm run lint
          npm run test:unit
          npm run web:build
      - name: Publish validated implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .epic05-overlay .epic05-fix
          rm -f .github/workflows/epic05-bootstrap.yml
          git config user.name "LifeTrace EPIC-05 Agent"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat(epic05): implement Windows profile-aware offline sync"
          git push origin HEAD:agent/epic-05-windows-sync-core
