name: EPIC-05 Apply and Validate

on:
  push:
    branches: [agent/epic-05-windows-sync-core]
    paths: [".github/workflows/epic05-bootstrap.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: epic05-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-test-push:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/epic-05-windows-sync-core
          fetch-depth: 0
      - name: Verify and apply implementation overlays
        shell: bash
        run: |
          set -euo pipefail
          cat .epic05-overlay/chunk-* | base64 -d > /tmp/epic05-base.tar.xz
          echo "06c48794f267d29e22fe33a97f8a0f2eb938ebb69b0300dd3c1b4679a12037ac  /tmp/epic05-base.tar.xz" | sha256sum --check
          test "$(stat -c %s /tmp/epic05-base.tar.xz)" = "60456"
          xz -t /tmp/epic05-base.tar.xz
          tar -tJf /tmp/epic05-base.tar.xz >/dev/null
          tar -xJf /tmp/epic05-base.tar.xz

          cat .epic05-fix2/chunk-* | base64 -d > /tmp/epic05-fix2.tar.xz
          echo "9a99093829e7b65fe747ebfd0b1975a504de1322a0e8d79c65754c9df6d5c169  /tmp/epic05-fix2.tar.xz" | sha256sum --check
          test "$(stat -c %s /tmp/epic05-fix2.tar.xz)" = "30040"
          xz -t /tmp/epic05-fix2.tar.xz
          tar -tJf /tmp/epic05-fix2.tar.xz >/dev/null
          tar -xJf /tmp/epic05-fix2.tar.xz

          python3 - <<'PY'
          from pathlib import Path

          path = Path('src-tauri/src/server.rs')
          source = path.read_text(encoding='utf-8')
          old = '''pub async fn serve(
              data_dir: PathBuf,
              resource_dir: PathBuf,
              photo_runtime: Arc<photo::Runtime>,
          ) -> Result<(), Box<dyn std::error::Error + Send + Sync>> {'''
          new = '''pub async fn serve(
              data_dir: PathBuf,
              resource_dir: PathBuf,
              photo_runtime: Arc<photo::Runtime>,
              sync_state: crate::sync::SyncDesktopState,
          ) -> Result<(), Box<dyn std::error::Error + Send + Sync>> {'''
          if old not in source:
              raise SystemExit('server::serve signature did not match the expected pre-fix source')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Install Tauri Linux build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo timeout 240s apt-get update \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20
          sudo timeout 240s apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Create required bundled dictionary resource
        run: |
          python3 - <<'PY'
          import sqlite3
          from pathlib import Path
          path = Path('xunji_service/data/dictionary.db')
          path.parent.mkdir(parents=True, exist_ok=True)
          with sqlite3.connect(path) as db:
              db.execute('CREATE TABLE IF NOT EXISTS dictionary_meta (key TEXT PRIMARY KEY, value TEXT NOT NULL)')
              db.execute("INSERT OR REPLACE INTO dictionary_meta(key, value) VALUES ('generated_for_ci', 'true')")
          PY
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/lifetrace-contracts
            crates/lifetrace-sync-client
            src-tauri
      - name: Format and resolve lockfiles
        run: |
          cargo fmt --manifest-path crates/lifetrace-sync-client/Cargo.toml
          cargo fmt --manifest-path src-tauri/Cargo.toml
          cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
      - name: Contract tests
        run: cargo test --manifest-path crates/lifetrace-contracts/Cargo.toml
      - name: Pure sync core tests
        run: cargo test --manifest-path crates/lifetrace-sync-client/Cargo.toml --all-features
      - name: Desktop database and adapter tests
        id: desktop-tests
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          cargo test --manifest-path src-tauri/Cargo.toml --lib -- --test-threads=1 2>&1 | tee epic05-desktop-test.log
      - name: Upload desktop test diagnostics
        if: always() && steps.desktop-tests.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: epic05-desktop-test-log
          path: epic05-desktop-test.log
          if-no-files-found: error
          retention-days: 1
      - name: Stop after desktop test failure
        if: steps.desktop-tests.outcome == 'failure'
        run: exit 1
      - name: Clippy pure sync core
        run: cargo clippy --manifest-path crates/lifetrace-sync-client/Cargo.toml --all-targets --all-features -- -D warnings
      - name: Clippy desktop library
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --lib -- -D warnings
      - name: Frontend install and validation
        run: |
          npm ci
          npm run lint
          npm run test:unit
          npm run web:build
      - name: Publish validated implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .epic05-overlay .epic05-fix .epic05-fix2
          rm -f .github/workflows/epic05-bootstrap.yml epic05-base-overlay.tar.xz epic05-fix-diagnostic.tar.xz
          git config user.name "LifeTrace EPIC-05 Agent"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat(epic05): implement Windows profile-aware offline sync"
          git push origin HEAD:agent/epic-05-windows-sync-core
