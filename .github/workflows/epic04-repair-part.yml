name: EPIC-04 Repair Patch Part
# repair-revision: 4

on:
  push:
    branches:
      - agent/epic-04-auth-complete
    paths:
      - '.github/workflows/epic04-repair-part.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild damaged patch part
        run: |
          cat .epic04/fixed-020 .epic04/fixed-021 > .epic04/patch-02
          wc -c .epic04/patch-02
          sha256sum .epic04/patch-02
      - name: Commit repaired part
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .epic04/patch-02
          git commit -m 'ci: repair EPIC-04 patch transport'
          git push origin HEAD:agent/epic-04-auth-complete
