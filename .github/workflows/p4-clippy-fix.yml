name: P4 Clippy Fix

on:
  push:
    branches: [execution-workspace-p4]
    paths: [".github/workflows/p4-clippy-fix.yml"]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: execution-workspace-p4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt
      - name: Apply clippy simplification
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('services/cloud/src/bin/execution_worker.rs')
          text = p.read_text()
          old = '(!scheduled_start.is_some()).then(|| format!("{date}T23:59:00Z"))'
          new = 'scheduled_start.is_none().then(|| format!("{date}T23:59:00Z"))'
          if old not in text:
              raise SystemExit('expected clippy expression not found')
          p.write_text(text.replace(old, new, 1))
          PY
          cargo fmt --manifest-path services/cloud/Cargo.toml
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/cloud/src/bin/execution_worker.rs
          git commit -m "fix(execution): satisfy worker clippy"
          git push origin HEAD:execution-workspace-p4
