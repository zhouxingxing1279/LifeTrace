name: Frontend V2 - Web + Desktop

on:
  push:
    branches:
      - feature/frontend-v2-clean-rewrite
      - main
    paths:
      - "AGENTS.md"
      - "apps/web/**"
      - "apps/desktop/**"
      - "contracts/**"
      - "docs/ui/**"
      - ".github/workflows/web-v2.yml"
  pull_request:
    branches: [main]
    paths:
      - "AGENTS.md"
      - "apps/web/**"
      - "apps/desktop/**"
      - "contracts/**"
      - "docs/ui/**"
      - ".github/workflows/web-v2.yml"

concurrency:
  group: frontend-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture:
    name: Clean-room architecture guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate clean-room boundaries
        shell: bash
        run: |
          set -euo pipefail
          test -f AGENTS.md
          test -f docs/ui/frontend-v2-capability-inventory.md
          test -f apps/web/src/v2/design-system/ui.tsx
          test -f apps/web/src/v2/v2.css
          test -f apps/desktop/tauri-ui/main.tsx
          test -f apps/desktop/src/platform-v2/desktop.ts
          test ! -d apps/desktop/app
          test ! -d apps/desktop/src/components
          test ! -d apps/desktop/src/ui
          grep -q 'web/src/v2/App' apps/desktop/tauri-ui/main.tsx
          grep -q 'desktopPlatform' apps/desktop/tauri-ui/main.tsx
          grep -q '3e02e499431bdceae2051c1dfb980898d26ef5e1' apps/web/src/v2/features/finance/UPSTREAM.md
          grep -q 'AGPL-3.0' apps/web/THIRD_PARTY_NOTICES.md
      - name: Validate mandatory primitives and semantic tokens
        shell: bash
        run: |
          set -euo pipefail
          ui=apps/web/src/v2/design-system/ui.tsx
          css=apps/web/src/v2/v2.css
          for primitive in Button IconButton Input Textarea SearchField Select SegmentedControl Switch Checkbox Card StatCard List ListItem Table Badge Progress Tabs Popover Dropdown ContextMenu CommandPalette Modal AlertDialog Sheet Toast EmptyState Skeleton Tooltip ChartContainer; do
            grep -q "$primitive" "$ui" || { echo "Missing primitive: $primitive"; exit 1; }
          done
          for token in --bg-primary --surface-primary --text-primary --text-secondary --accent --success --warning --danger --radius-sm --radius-md --radius-lg --space-1 --space-4 --space-8 --blur-md --duration-normal --ease-apple; do
            grep -q -- "$token" "$css" || { echo "Missing token: $token"; exit 1; }
          done
      - name: Validate Finance route parity
        shell: bash
        run: |
          set -euo pipefail
          app=apps/web/src/v2/App.tsx
          for route in /app/finance /app/finance/transactions /app/finance/calendar /app/finance/ledgers /app/finance/budgets /app/finance/accounts /app/finance/categories /app/finance/tags /app/finance/import; do
            grep -q "$route" "$app" || { echo "Missing finance route: $route"; exit 1; }
          done

  web:
    name: Web typecheck, unit, build, E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: apps/web/package.json
      - name: Install Web dependencies
        run: npm install --prefix apps/web --no-audit --no-fund
      - name: TypeScript
        run: npm --prefix apps/web run typecheck
      - name: Unit tests
        run: npm --prefix apps/web test
      - name: Production build
        run: npm --prefix apps/web run build
      - name: Install Playwright Chromium
        run: npx --prefix apps/web playwright install --with-deps chromium
      - name: Desktop + mobile E2E
        run: npm --prefix apps/web run test:e2e

  desktop:
    name: Desktop shared renderer + preserved capability regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
      - name: Install shared Web dependencies
        run: npm install --prefix apps/web --no-audit --no-fund
      - name: Install Desktop dependencies
        run: npm install --prefix apps/desktop --ignore-scripts --no-audit --no-fund
      - name: Desktop TypeScript
        run: npm --prefix apps/desktop run lint
      - name: V2 architecture smoke
        run: npx --prefix apps/desktop tsx --test apps/desktop/tests/v2-architecture.test.ts
      - name: Preserved non-visual unit regression
        run: npm --prefix apps/desktop run test:unit
      - name: Shared browser build
        run: npm --prefix apps/desktop run browser:build
      - name: Tauri renderer build
        run: npm --prefix apps/desktop run web:build

  rust-tauri:
    name: Rust tests + Tauri production compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install shared Web dependencies
        run: npm install --prefix apps/web --no-audit --no-fund
      - name: Install Desktop dependencies
        run: npm install --prefix apps/desktop --ignore-scripts --no-audit --no-fund
      - name: Rust unit tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --lib
      - name: Tauri production compile
        run: npm --prefix apps/desktop run tauri -- build --no-bundle
