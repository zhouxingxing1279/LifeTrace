name: Dispatch LifeTrace 0.3.0 Release

on:
  push:
    branches:
      - release/0.3.0
    paths:
      - .github/workflows/dispatch-release-030.yml

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.3.0
          fetch-depth: 0

      - name: Dispatch existing Windows release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release-windows.yml --repo zhouxingxing1279/LifeTrace --ref main -f version=0.3.0

      - name: Remove one-shot dispatcher
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/dispatch-release-030.yml
          git commit -m "ci(release): remove 0.3.0 dispatcher"
          git push origin HEAD:release/0.3.0
