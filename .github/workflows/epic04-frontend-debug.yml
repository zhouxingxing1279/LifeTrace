name: EPIC-04 Frontend Diagnostic
# diagnostic-revision: 3

on:
  push:
    branches:
      - agent/epic-04-auth-complete
    paths:
      - '.github/workflows/epic04-frontend-debug.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply EPIC-04
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip
          from pathlib import Path
          payload = ''.join(path.read_text() for path in sorted(Path('.epic04').glob('patch-*')))
          Path('/tmp/epic04.patch').write_bytes(gzip.decompress(base64.b64decode(payload)))
          PY
          git apply /tmp/epic04.patch
          python .epic04/apply-fix.py
          python .epic04/apply-contract-fix.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/lifetrace-contracts
            tools/contract-exporter
          shared-key: epic04-frontend-contract-diagnostic
      - name: Generate public contracts
        run: cargo run --manifest-path tools/contract-exporter/Cargo.toml
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run and summarize frontend validation
        shell: bash
        run: |
          set +e
          npm test > /tmp/frontend.log 2>&1
          status=$?
          {
            echo "exit_status=$status"
            echo "=== TYPESCRIPT / TEST / BUILD ERRORS ==="
            grep -n -A24 -B10 -E 'error TS[0-9]+|ERR!|FAIL|not ok|AssertionError|TypeError|ReferenceError|Build failed|error during build|Could not resolve|is not assignable|Property .* does not exist|Expected .* arguments|Cannot find|has no exported member|Module .* has no exported' /tmp/frontend.log | tail -900 || true
            echo "=== GENERATED AUTH CONTRACT HEADER ==="
            head -24 contracts/typescript/lifetrace-auth.generated.ts || true
            echo "=== LOG TAIL ==="
            tail -450 /tmp/frontend.log
          } > epic04-frontend-summary.txt
          cat epic04-frontend-summary.txt
          exit $status
      - name: Upload concise diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: epic04-frontend-summary
          path: epic04-frontend-summary.txt
          if-no-files-found: error
