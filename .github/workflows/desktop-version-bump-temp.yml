name: Temporary Desktop Version Bump

on:
  pull_request:
    paths:
      - ".github/workflows/desktop-version-bump-temp.yml"

permissions:
  contents: write

jobs:
  bump:
    if: github.head_ref == 'agent/desktop-web-v2-sync'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update desktop version metadata
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const version = '0.3.3';
          for (const file of ['apps/desktop/package.json', 'apps/desktop/package-lock.json', 'apps/desktop/src-tauri/tauri.conf.json']) {
            const json = JSON.parse(fs.readFileSync(file, 'utf8'));
            json.version = version;
            if (file.endsWith('package-lock.json') && json.packages?.['']) json.packages[''].version = version;
            fs.writeFileSync(file, `${JSON.stringify(json, null, 2)}\n`);
          }
          NODE
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('apps/desktop/src-tauri/Cargo.toml')
          text = path.read_text()
          text, count = re.subn(r'(?m)^version\s*=\s*"[^"]+"', 'version = "0.3.3"', text, count=1)
          if count != 1:
              raise SystemExit('Cargo.toml package version not found')
          path.write_text(text)
          path = Path('apps/desktop/src/services/cloudAuth.ts')
          text = path.read_text().replace('const CLIENT_VERSION = "0.3.2";', 'const CLIENT_VERSION = "0.3.3";')
          path.write_text(text)
          PY
          git rm .github/workflows/desktop-version-bump-temp.yml
      - name: Commit generated version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/desktop/package.json apps/desktop/package-lock.json apps/desktop/src-tauri/tauri.conf.json apps/desktop/src-tauri/Cargo.toml apps/desktop/src/services/cloudAuth.ts .github/workflows/desktop-version-bump-temp.yml
          git commit -m "chore(release): bump desktop to v0.3.3"
          git push origin HEAD:${{ github.head_ref }}
