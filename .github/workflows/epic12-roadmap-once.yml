name: EPIC-12 roadmap completion once

on:
  push:
    branches:
      - agent/epic12-file-storage

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/epic12-file-storage
          fetch-depth: 0
      - name: Mark EPIC-12 roadmap implementation complete and self-remove
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('docs/roadmap.md')
          text = path.read_text()
          start = text.index('# EPIC-12：文件、附件与对象存储')
          end = text.index('\n---\n\n# EPIC-13：', start)
          section = text[start:end]
          if '- [ ]' not in section:
              raise SystemExit('EPIC-12 section has no pending checklist items')
          section = section.replace('- [ ]', '- [x]')
          text = text[:start] + section + text[end:]
          path.write_text(text)
          PY
          rm .github/workflows/epic12-roadmap-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs(epic12): mark roadmap implementation complete'
          git push origin HEAD:agent/epic12-file-storage
