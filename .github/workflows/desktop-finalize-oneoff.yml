name: Desktop finalize one-off

on:
  push:
    branches:
      - refactor/desktop-decouple-web
    paths:
      - scripts/desktop_finalize_patch.py
      - .github/workflows/desktop-finalize-oneoff.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/desktop-decouple-web
          fetch-depth: 0
      - name: Normalize one-off patch script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/desktop_finalize_patch.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('if count != 1:', 'if count < 1:')
          text = text.replace('expected exactly one match, found {count}', 'expected at least one match, found {count}')
          text = text.replace('    let repository = &crate::database::repositories::english;\n', '')
          text = text.replace('repository::put(', 'crate::database::repositories::english::put(')
          text = text.replace('repository::get(', 'crate::database::repositories::english::get(')
          text = text.replace('repository::remove(', 'crate::database::repositories::english::remove(')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Apply patch
        run: python3 scripts/desktop_finalize_patch.py
      - name: Format Rust
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Validate patch shape
        run: |
          git diff --check
          test -n "$(git status --porcelain)"
      - name: Remove one-off machinery and commit
        run: |
          git rm -f scripts/desktop_finalize_patch.py .github/workflows/desktop-finalize-oneoff.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor(desktop): complete core local-first sync writes"
          git push origin HEAD:refactor/desktop-decouple-web
