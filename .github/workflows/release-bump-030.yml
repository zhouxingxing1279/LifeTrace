name: Prepare LifeTrace 0.3.0

on:
  push:
    branches:
      - release/0.3.0
    paths:
      - .github/workflows/release-bump-030.yml

permissions:
  contents: write

jobs:
  bump-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.3.0
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bump desktop release metadata
        shell: bash
        run: |
          set -euo pipefail
          npm version 0.3.0 --prefix apps/desktop --no-git-tag-version --allow-same-version
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const tauriPath = 'apps/desktop/src-tauri/tauri.conf.json';
          const tauri = JSON.parse(fs.readFileSync(tauriPath, 'utf8'));
          tauri.version = '0.3.0';
          fs.writeFileSync(tauriPath, JSON.stringify(tauri, null, 2) + '\n');

          const cargoPath = 'apps/desktop/src-tauri/Cargo.toml';
          const cargo = fs.readFileSync(cargoPath, 'utf8').replace(
            /^(version\s*=\s*")[^"]+("\s*)$/m,
            '$10.3.0$2',
          );
          fs.writeFileSync(cargoPath, cargo);
          NODE
          node scripts/check-version-consistency.mjs

      - name: Commit version bump and remove helper workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/release-bump-030.yml
          git add apps/desktop/package.json apps/desktop/package-lock.json apps/desktop/src-tauri/tauri.conf.json apps/desktop/src-tauri/Cargo.toml
          git diff --cached --check
          git commit -m "chore(release): bump desktop to 0.3.0"
          git push origin HEAD:release/0.3.0
