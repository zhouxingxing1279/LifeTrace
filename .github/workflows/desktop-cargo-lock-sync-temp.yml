name: Temporary Cargo Lock Version Sync

on:
  pull_request:
    paths:
      - ".github/workflows/desktop-cargo-lock-sync-temp.yml"

permissions:
  contents: write

jobs:
  sync-lock:
    if: github.head_ref == 'agent/desktop-web-v2-sync'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Sync root package version in Cargo.lock
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/desktop/src-tauri/Cargo.lock')
          text = path.read_text()
          old = 'name = "lifetrace"\nversion = "0.3.2"'
          new = 'name = "lifetrace"\nversion = "0.3.3"'
          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text)
          elif new not in text:
              raise SystemExit('LifeTrace root package entry was not found in Cargo.lock')
          PY
          git rm .github/workflows/desktop-cargo-lock-sync-temp.yml
      - name: Commit synchronized lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/desktop/src-tauri/Cargo.lock
          git commit -m "chore(release): sync Cargo.lock to v0.3.3"
          git push origin HEAD:${{ github.head_ref }}
