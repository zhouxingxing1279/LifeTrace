name: EPIC13 Fix Bootstrap

on:
  push:
    branches: [feat/epic-13-web-pwa]
    paths:
      - "epic13-fix/READY"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/epic-13-web-pwa
          fetch-depth: 0
      - name: Apply EPIC13 integration fixes
        shell: bash
        run: |
          set -euo pipefail
          cat epic13-fix/chunk-* | base64 --decode > /tmp/epic13-fix.tar.gz
          tar -xzf /tmp/epic13-fix.tar.gz
          rm -rf epic13-fix
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web-client/src/core.ts web-client/src/App.tsx tests/web-client.test.ts services/lifetrace-cloud/src/routes/sync.rs epic13-fix
          git commit -m "fix(epic13): integrate cookie-authenticated sync safely"
          git push origin HEAD:feat/epic-13-web-pwa
