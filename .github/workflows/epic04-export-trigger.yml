name: EPIC-04 Export Current Branch

on:
  push:
    branches:
      - agent/epic-04-auth-complete
    paths:
      - '.github/workflows/epic04-export-trigger.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch source export
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run epic04-source-export.yml --repo '${{ github.repository }}' --ref '${{ github.ref_name }}'
