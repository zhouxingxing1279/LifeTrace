name: EPIC20 Phase9A Clean Export

on:
  push:
    branches:
      - agent/epic20-phase9a-relations-completion

permissions:
  contents: write

jobs:
  validate-export:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/epic20-phase9a-relations-completion
          fetch-depth: 0
      - name: Install Tauri Linux dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo timeout 240s apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20
          sudo timeout 240s apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Create required bundled dictionary resource
        run: |
          python3 - <<'PY'
          import sqlite3
          from pathlib import Path
          path = Path('apps/desktop/xunji_service/data/dictionary.db')
          path.parent.mkdir(parents=True, exist_ok=True)
          with sqlite3.connect(path) as db:
              db.execute('CREATE TABLE IF NOT EXISTS dictionary_meta (key TEXT PRIMARY KEY, value TEXT NOT NULL)')
          PY
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Assemble formal changes
        run: |
          python tools/epic20_phase9a_patch.py
          python tools/epic20_phase9a_nested_tx_fix.py
      - name: Rustfmt
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Rust compile check
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --lib
      - name: Domain completion lifecycle test
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --lib execution_relation::tests::completion_result_requires_done_task_and_is_editable -- --exact --test-threads=1 --nocapture
      - name: Domain external relation test
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --lib execution_relation::tests::relation_requires_at_least_one_existing_execution_entity -- --exact --test-threads=1 --nocapture
      - name: Domain missing execution target test
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --lib execution_relation::tests::internal_execution_targets_must_exist -- --exact --test-threads=1 --nocapture
      - name: Repository completion upsert test
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --lib database::repositories::execution_relation::tests::completion_result_upserts_and_soft_deletes -- --exact --test-threads=1 --nocapture
      - name: Repository relation idempotency test
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --lib database::repositories::execution_relation::tests::links_are_bidirectionally_queryable_and_idempotent -- --exact --test-threads=1 --nocapture
      - name: Completion backfill migration test
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --lib database::migrations::m0011_execution_completion_backfill::tests::backfill_creates_missing_completion_result_once -- --exact --test-threads=1 --nocapture
      - name: Legacy migration tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --lib migration -- --test-threads=1 --nocapture
      - name: Legacy execution tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --lib execution::tests -- --test-threads=1 --nocapture
      - name: Legacy sync and outbox tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --lib sync -- --test-threads=1 --nocapture
      - name: Task to waiting transaction regression
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --lib execution_waiting::tests::task_to_waiting_is_atomic_and_does_not_duplicate_open_item -- --exact --test-threads=1 --nocapture
      - name: Desktop Rust tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --lib -- --test-threads=1
      - name: Desktop Clippy
        run: |
          cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --lib -- \
            -D warnings \
            -A dead_code \
            -A clippy::explicit_auto_deref \
            -A clippy::field_reassign_with_default \
            -A clippy::manual_async_fn \
            -A clippy::map_identity \
            -A clippy::needless_borrow \
            -A clippy::needless_question_mark \
            -A clippy::needless_range_loop \
            -A clippy::question_mark \
            -A clippy::redundant_closure \
            -A clippy::result_large_err \
            -A clippy::too_many_arguments \
            -A clippy::type_complexity \
            -A clippy::uninlined_format_args \
            -A clippy::unnecessary_lazy_evaluations
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Frontend typecheck
        working-directory: apps/desktop
        run: npm run lint
      - name: Frontend unit tests
        working-directory: apps/desktop
        run: npm run test:unit
      - name: Frontend web build
        working-directory: apps/desktop
        run: npm run web:build
      - name: Export clean branch
        shell: bash
        run: |
          set -euo pipefail
          FORMAL=(
            apps/desktop/src-tauri/src/database/migrations/m0011_execution_completion_backfill.rs
            apps/desktop/src-tauri/src/database/migrations/mod.rs
            apps/desktop/src-tauri/src/database/repositories/execution_relation.rs
            apps/desktop/src-tauri/src/database/repositories/mod.rs
            apps/desktop/src-tauri/src/execution.rs
            apps/desktop/src-tauri/src/execution_relation.rs
            apps/desktop/src-tauri/src/lib.rs
            apps/desktop/src-tauri/src/server.rs
            apps/desktop/src-tauri/src/server/execution_relation.rs
            apps/desktop/src/services/executionApi.ts
          )
          git diff origin/main -- "${FORMAL[@]}" > /tmp/phase9a.patch
          test -s /tmp/phase9a.patch
          git checkout -B agent/epic20-phase9a-relations-completion-clean origin/main
          git reset --hard origin/main
          git clean -fd
          git apply /tmp/phase9a.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${FORMAL[@]}"
          git diff --cached --check
          git commit -m "feat(epic20): add completion results and relation service"
          git push --force origin agent/epic20-phase9a-relations-completion-clean