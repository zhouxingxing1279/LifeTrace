name: EPIC-04 Apply and Validate

on:
  push:
    branches:
      - agent/epic-04-auth-complete
    paths:
      - '.github/workflows/epic04-apply.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-linux:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lifetrace
          POSTGRES_PASSWORD: lifetrace_test_password
          POSTGRES_DB: lifetrace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lifetrace -d lifetrace_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://lifetrace:lifetrace_test_password@127.0.0.1:5432/lifetrace_test
      TEST_DATABASE_URL: postgres://lifetrace:lifetrace_test_password@127.0.0.1:5432/lifetrace_test
      AUTH_PASSWORD_PEPPER: epic04-test-password-pepper
      AUTH_TOKEN_HASH_PEPPER: epic04-test-token-pepper
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Apply staged implementation
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip
          from pathlib import Path
          payload = ''.join(path.read_text() for path in sorted(Path('.epic04').glob('patch-*')))
          Path('/tmp/epic04.patch').write_bytes(gzip.decompress(base64.b64decode(payload)))
          PY
          git apply --index /tmp/epic04.patch
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            services/lifetrace-cloud
            crates/lifetrace-contracts
            tools/contract-exporter
            src-tauri
      - name: Install Tauri build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Format Rust sources
        run: |
          cargo fmt --manifest-path crates/lifetrace-contracts/Cargo.toml
          cargo fmt --manifest-path services/lifetrace-cloud/Cargo.toml
          cargo fmt --manifest-path tools/contract-exporter/Cargo.toml
          cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Generate public contracts
        run: cargo run --manifest-path tools/contract-exporter/Cargo.toml
      - name: Install frontend dependencies
        run: npm ci
      - name: Contract tests
        run: cargo test --manifest-path crates/lifetrace-contracts/Cargo.toml
      - name: Cloud PostgreSQL and API tests
        run: cargo test --manifest-path services/lifetrace-cloud/Cargo.toml -- --test-threads=1
      - name: Desktop Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Frontend validation
        run: npm test
      - name: Clippy contracts
        run: cargo clippy --manifest-path crates/lifetrace-contracts/Cargo.toml --all-targets -- -D warnings
      - name: Clippy cloud production targets
        run: cargo clippy --manifest-path services/lifetrace-cloud/Cargo.toml --lib --bins -- -D warnings
      - name: Docker build
        run: docker build -f services/lifetrace-cloud/Dockerfile .
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: epic04-linux-diagnostics
          path: |
            services/lifetrace-cloud/Cargo.lock
            crates/lifetrace-contracts/Cargo.lock
            tools/contract-exporter/Cargo.lock
            src-tauri/Cargo.lock
            contracts/
          if-no-files-found: warn

  validate-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply staged implementation
        shell: pwsh
        run: |
          @'
          import base64, gzip
          from pathlib import Path
          payload = ''.join(path.read_text() for path in sorted(Path('.epic04').glob('patch-*')))
          Path('epic04.patch').write_bytes(gzip.decompress(base64.b64decode(payload)))
          '@ | python -
          git apply --index epic04.patch
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Format desktop Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Check Windows desktop credential integration
        run: cargo check --manifest-path src-tauri/Cargo.toml

  publish:
    needs: [validate-linux, validate-windows]
    runs-on: ubuntu-latest
    env:
      AUTH_PASSWORD_PEPPER: epic04-test-password-pepper
      AUTH_TOKEN_HASH_PEPPER: epic04-test-token-pepper
    steps:
      - uses: actions/checkout@v4
      - name: Apply staged implementation
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip
          from pathlib import Path
          payload = ''.join(path.read_text() for path in sorted(Path('.epic04').glob('patch-*')))
          Path('/tmp/epic04.patch').write_bytes(gzip.decompress(base64.b64decode(payload)))
          PY
          git apply --index /tmp/epic04.patch
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt
      - name: Format and resolve lockfiles
        run: |
          cargo fmt --manifest-path crates/lifetrace-contracts/Cargo.toml
          cargo fmt --manifest-path services/lifetrace-cloud/Cargo.toml
          cargo fmt --manifest-path tools/contract-exporter/Cargo.toml
          cargo fmt --manifest-path src-tauri/Cargo.toml
          cargo check --manifest-path crates/lifetrace-contracts/Cargo.toml
          cargo check --manifest-path services/lifetrace-cloud/Cargo.toml
          cargo check --manifest-path src-tauri/Cargo.toml
          cargo run --manifest-path tools/contract-exporter/Cargo.toml
      - name: Remove temporary transport files
        run: |
          rm -rf .epic04
          rm -f .github/workflows/epic04-apply.yml
          rm -f .github/workflows/epic04-source-export.yml
      - name: Commit validated implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(auth): implement EPIC-04 account authentication and devices'
          git push origin HEAD:agent/epic-04-auth-complete
