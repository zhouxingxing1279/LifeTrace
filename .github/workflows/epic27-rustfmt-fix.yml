name: EPIC-27 Rustfmt Fix

on:
  push:
    branches: ["agent/epic27-mail-ui"]
    paths: [".github/workflows/epic27-rustfmt-fix.yml"]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/epic27-mail-ui
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt
      - name: Format cloud workspace and guard scope
        run: |
          cargo fmt --manifest-path services/cloud/Cargo.toml
          changed="$(git diff --name-only -- services/cloud/src services/cloud/Cargo.toml)"
          echo "$changed"
          test "$changed" = "services/cloud/src/mail/protocol.rs"
      - name: Commit format fix and remove helper
        run: |
          rm .github/workflows/epic27-rustfmt-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style(mail): format protocol after test move"
          git push origin HEAD:agent/epic27-mail-ui
