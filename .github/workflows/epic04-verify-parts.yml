name: EPIC-04 Verify Patch Parts
# transport-revision: 6

on:
  push:
    branches:
      - agent/epic-04-auth-complete
    paths:
      - '.github/workflows/epic04-verify-parts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify transport hashes
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib
          names = ['patch-00', 'patch-01', 'patch-02', 'patch-03']
          payload = ''
          for name in names:
              path = Path('.epic04') / name
              data = path.read_text()
              payload += data
              print(name, len(data), hashlib.sha256(data.encode()).hexdigest())
          print('total', len(payload), hashlib.sha256(payload.encode()).hexdigest())
          raw = gzip.decompress(base64.b64decode(payload))
          print('patch', len(raw), hashlib.sha256(raw).hexdigest())
          PY
