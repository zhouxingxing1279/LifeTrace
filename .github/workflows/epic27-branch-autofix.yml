name: EPIC-27 Branch Autofix

on:
  push:
    branches:
      - agent/epic27-mail-foundation

permissions:
  contents: write

jobs:
  format-and-lock:
    if: contains(github.event.head_commit.message, '[run-epic27-format]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/epic27-mail-foundation
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt
      - name: Format cloud Rust and refresh lockfile
        run: |
          cargo fmt --manifest-path services/cloud/Cargo.toml
          cargo generate-lockfile --manifest-path services/cloud/Cargo.toml
      - name: Commit generated changes
        run: |
          if git diff --quiet -- services/cloud/src services/cloud/Cargo.toml services/cloud/Cargo.lock; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/cloud/src services/cloud/Cargo.toml services/cloud/Cargo.lock
          git commit -m "chore(epic27): apply rustfmt and refresh cloud lockfile"
          git push origin HEAD:agent/epic27-mail-foundation
