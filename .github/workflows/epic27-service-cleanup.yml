name: EPIC-27 Service Cleanup

on:
  push:
    branches:
      - agent/epic27-mail-foundation

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, '[run-epic27-service-cleanup]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/epic27-mail-foundation
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt,clippy
      - name: Apply narrow service cleanup
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path("services/cloud/src/mail/service.rs")
          text = path.read_text()
          dead = "const MESSAGE_SELECT_FIELDS: &str = r#\"\nid,account_id,folder_id,thread_id,remote_uid,uidvalidity,message_id,in_reply_to,subject,\nfrom_json,to_json,cc_json,reply_to_json,sent_at,received_at,flags_json,is_read,is_archived,\nsize_bytes,snippet,body_text,body_html_sanitized,has_attachments\n\"#;\n\n"
          if dead not in text:
              raise SystemExit("unused MESSAGE_SELECT_FIELDS block not found")
          text = text.replace(dead, "", 1)
          marker = "#[cfg(test)]\nmod tests {\n    use super::*;\n"
          replacement = "#[cfg(test)]\nmod tests {\n    use super::*;\n    use crate::mail::domain::MailProvider;\n"
          if marker not in text:
              raise SystemExit("test module marker not found")
          path.write_text(text.replace(marker, replacement, 1))
          PY
      - name: Format cloud Rust
        run: cargo fmt --manifest-path services/cloud/Cargo.toml
      - name: Compile cloud tests
        run: cargo test --manifest-path services/cloud/Cargo.toml --lib --no-run
      - name: Clippy cloud targets
        run: cargo clippy --manifest-path services/cloud/Cargo.toml --all-targets -- -D warnings
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/cloud/src/mail/service.rs
          git commit -m "fix(epic27): keep test-only provider import scoped"
          git push origin HEAD:agent/epic27-mail-foundation
