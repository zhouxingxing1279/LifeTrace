name: Temporary Windows Unit Release Gate Validation

on:
  push:
    branches:
      - ops/validate-release-test-gates

permissions:
  contents: write

jobs:
  windows-unit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/release-test-gates
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install desktop dependencies
        run: npm ci --prefix apps/desktop
      - name: Run desktop unit tests on Windows checkout
        working-directory: apps/desktop
        run: npm run test:unit

  cleanup:
    if: always()
    needs: windows-unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/validate-release-test-gates
      - name: Remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-windows-unit-release-gates.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(ci): remove temporary Windows unit validator"
          git push origin HEAD:ops/validate-release-test-gates
