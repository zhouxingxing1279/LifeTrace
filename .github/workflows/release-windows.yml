name: Release Windows Installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "要发布的版本（必须与 apps/desktop/package.json / tauri.conf.json / Cargo.toml 一致），例如 0.2.2"
        required: false
        type: string

permissions:
  contents: read

jobs:
  release-windows:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Create required bundled dictionary resource
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force apps/desktop/xunji_service/data | Out-Null
          python -c "import sqlite3; db=sqlite3.connect(r'apps/desktop/xunji_service/data/dictionary.db'); db.execute('CREATE TABLE IF NOT EXISTS dictionary_meta (key TEXT PRIMARY KEY, value TEXT NOT NULL)'); db.close()"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/lifetrace-sync-client
            apps/desktop/src-tauri

      - name: Install npm dependencies
        run: npm ci --prefix apps/desktop

      - name: Check version consistency
        run: node scripts/check-version-consistency.mjs

      - name: Resolve release tag from configuration
        id: tag
        shell: pwsh
        run: |
          $config = Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $requested = "${{ inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($requested)) {
            $requested = $config.version
          }
          if ($requested -ne $config.version) {
            throw "输入的版本 $requested 与配置文件版本 $($config.version) 不一致，拒绝发布。"
          }
          "tag=v$requested" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Frontend build
        run: npm run web:build

      - name: Prepare release notes
        id: release_notes
        shell: pwsh
        run: |
          $config = Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $version = $config.version
          $body = "LifeTrace v$version 正式发布（Windows NSIS 安装包）。"
          $body += "`n`n更新内容：`n"
          $body += (git log -1 --pretty=format:"- %h %s")
          "body<<EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $body | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build NSIS installer and publish GitHub Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ steps.tag.outputs.tag }}
          releaseName: LifeTrace ${{ steps.tag.outputs.tag }}
          releaseBody: ${{ steps.release_notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          owner: zhouxingxing1279
          repo: LifeTrace-Releases
          releaseCommitish: main
          args: --verbose
          uploadUpdaterJson: false
          updaterJsonPreferNsis: true

      - name: Generate updater manifests
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          $ErrorActionPreference = "Stop"
          $headers = @{ Authorization = "Bearer $env:GITHUB_TOKEN" }
          $config = Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $version = [string]$config.version
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/zhouxingxing1279/LifeTrace-Releases/releases/tags/$env:RELEASE_TAG" -Headers $headers -TimeoutSec 60

          $installer = $release.assets |
            Where-Object { $_.name -like "*_${version}_x64-setup.exe" } |
            Sort-Object updated_at -Descending |
            Select-Object -First 1
          if (-not $installer) {
            $assetNames = @($release.assets | ForEach-Object { $_.name }) -join ', '
            throw "NSIS installer asset not found for version $version. Assets: $assetNames"
          }

          $signatureAsset = $release.assets |
            Where-Object { $_.name -eq "$($installer.name).sig" } |
            Select-Object -First 1
          if (-not $signatureAsset) {
            throw "Updater signature asset not found for $($installer.name)"
          }

          $sigResp = Invoke-WebRequest -Uri $signatureAsset.url -Headers @{ Authorization = "Bearer $env:GITHUB_TOKEN"; Accept = "application/octet-stream" } -TimeoutSec 60
          $signature = if ($sigResp.Content -is [byte[]]) {
            [System.Text.Encoding]::UTF8.GetString($sigResp.Content)
          } else {
            [string]$sigResp.Content
          }
          $signature = $signature.Trim()
          if ([string]::IsNullOrWhiteSpace($signature)) {
            throw "Updater signature content is empty for $($signatureAsset.name)"
          }

          $downloadUrl = [string]$installer.browser_download_url
          if ([string]::IsNullOrWhiteSpace($downloadUrl)) {
            throw "Installer browser_download_url is empty for $($installer.name)"
          }

          $publishedAt = if ($release.published_at) {
            ([DateTimeOffset]::Parse([string]$release.published_at)).ToUniversalTime().ToString("o")
          } else {
            [DateTimeOffset]::UtcNow.ToString("o")
          }
          $notes = if ($release.body) { [string]$release.body } else { "LifeTrace v$version" }

          $manifest = [ordered]@{
            version = $version
            notes = $notes
            pub_date = $publishedAt
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = $signature
                url = $downloadUrl
              }
              "windows-x86_64-nsis" = [ordered]@{
                signature = $signature
                url = $downloadUrl
              }
            }
          }

          $direct = $manifest | ConvertTo-Json -Depth 10 -Compress
          $cn = $direct -replace "https://github.com/zhouxingxing1279/LifeTrace-Releases", "https://gh-proxy.com/https://github.com/zhouxingxing1279/LifeTrace-Releases"
          $tmpDir = $env:RUNNER_TEMP
          [System.IO.File]::WriteAllText("$tmpDir\latest.json", $direct)
          [System.IO.File]::WriteAllText("$tmpDir\latest.cn.json", $cn)

          $env:GH_TOKEN = $env:GITHUB_TOKEN
          gh release upload $env:RELEASE_TAG "$tmpDir\latest.json" "$tmpDir\latest.cn.json" --repo zhouxingxing1279/LifeTrace-Releases --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "gh release upload failed with exit code $LASTEXITCODE"
          }

          $verify = Invoke-RestMethod -Uri "https://api.github.com/repos/zhouxingxing1279/LifeTrace-Releases/releases/tags/$env:RELEASE_TAG" -Headers $headers -TimeoutSec 60
          $names = @($verify.assets | ForEach-Object { $_.name })
          if ($names -notcontains "latest.json" -or $names -notcontains "latest.cn.json") {
            throw "Asset verification failed: $($names -join ', ')"
          }
          Write-Output "Published fresh latest.json and latest.cn.json from $($installer.name)"

      - name: Verify published updater metadata
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          $ErrorActionPreference = "Stop"
          $config = Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $expectedVersion = $config.version
          $tag = $env:RELEASE_TAG
          if ($tag -ne "v$expectedVersion") {
            throw "标签 $tag 与应用版本 v$expectedVersion 不一致，拒绝发布。"
          }
          $latestUrl = "https://github.com/zhouxingxing1279/LifeTrace-Releases/releases/latest/download/latest.json"
          $json = $null
          for ($attempt = 1; $attempt -le 12; $attempt++) {
            try {
              $candidate = Invoke-RestMethod -Uri $latestUrl -TimeoutSec 30
              if ($candidate.version) {
                $json = $candidate
                break
              }
            } catch {
              # 覆盖上传后 GitHub CDN 可能短暂不同步，重试
            }
            Write-Output "update metadata not ready yet, retrying ($attempt/12)..."
            Start-Sleep -Seconds 10
          }
          if (-not $json) {
            throw "latest.json 在重试窗口内未就绪或缺少 version 字段。"
          }
          if (-not $json.version) {
            throw "latest.json 缺少 version 字段。"
          }
          if ($json.version -ne $expectedVersion) {
            throw "latest.json 的 version $($json.version) 与项目版本 v$expectedVersion 不一致。"
          }
          $entry = $json.platforms."windows-x86_64"
          if (-not $entry) {
            throw "latest.json 缺少 platforms.windows-x86_64 条目。"
          }
          if ([string]::IsNullOrWhiteSpace($entry.url)) {
            throw "platforms.windows-x86_64.url 为空。"
          }
          if ([string]::IsNullOrWhiteSpace($entry.signature)) {
            throw "platforms.windows-x86_64.signature 为空。"
          }
          if ($entry.url -notmatch "^https://(?:github\.com/zhouxingxing1279/LifeTrace-Releases/releases/|api\.github\.com/repos/zhouxingxing1279/LifeTrace-Releases/releases/assets/)") {
            throw "platforms.windows-x86_64.url 未指向公开 LifeTrace-Releases 仓库：$($entry.url)"
          }
          Write-Output "latest.json 验证通过：version=$($json.version)，url=$($entry.url)"
