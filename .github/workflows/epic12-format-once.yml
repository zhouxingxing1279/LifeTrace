name: EPIC-12 one-time rustfmt

on:
  push:
    branches:
      - agent/epic12-file-storage

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/epic12-file-storage
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt
      - name: Format EPIC-12 Rust and self-remove
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path services/cloud/Cargo.toml
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml
          rm .github/workflows/epic12-format-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'style(epic12): apply rustfmt'
          git push origin HEAD:agent/epic12-file-storage
