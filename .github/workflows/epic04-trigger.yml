name: EPIC-04 Trigger Full Validation

on:
  push:
    branches:
      - agent/epic-04-auth-complete
    paths:
      - '.github/workflows/epic04-trigger.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch full EPIC-04 validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run epic04-apply.yml --repo '${{ github.repository }}' --ref '${{ github.ref_name }}'
