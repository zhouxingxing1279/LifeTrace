name: Snapshot LifeTrace v0.3.3 Fourth Attempt

on:
  push:
    branches:
      - agent/release-v0.3.3-verify
    paths:
      - ".github/workflows/release-v0.3.3-fourth-snapshot-temp.yml"

permissions:
  actions: read
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/release-v0.3.3-verify
      - name: Capture status
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REPO: zhouxingxing1279/LifeTrace
          SOURCE_SHA: 2571e59fb0364664e6a9dc7a0b280b14b5cbd452
        shell: bash
        run: |
          dispatcher="$(gh api "repos/$SOURCE_REPO/actions/workflows/release-windows-on-main.yml/runs?branch=main&per_page=30" --jq ".workflow_runs[] | select(.head_sha == \"$SOURCE_SHA\") | {id,status,conclusion,html_url,created_at,updated_at}" 2>/dev/null | head -n1 || true)"
          release="$(gh api "repos/$SOURCE_REPO/actions/workflows/release-windows.yml/runs?event=workflow_dispatch&branch=main&per_page=30" --jq ".workflow_runs[] | select(.head_sha == \"$SOURCE_SHA\") | {id,status,conclusion,html_url,created_at,updated_at}" 2>/dev/null | head -n1 || true)"
          [ -n "$dispatcher" ] || dispatcher='null'
          [ -n "$release" ] || release='null'
          jq -n --argjson dispatcher "$dispatcher" --argjson release "$release" '{dispatcher:$dispatcher,release:$release}' > release-v0.3.3-live-4.json
      - name: Persist and self-clean
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/release-v0.3.3-fourth-snapshot-temp.yml
          git add release-v0.3.3-live-4.json
          git commit -m "chore(release): record fourth v0.3.3 live status"
          git push origin HEAD:agent/release-v0.3.3-verify
