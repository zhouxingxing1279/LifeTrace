name: Temporary Desktop v0.3.1 Bump

on:
  push:
    branches:
      - release/desktop-v0.3.1

permissions:
  contents: write

jobs:
  bump-version:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/desktop-v0.3.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Bump desktop release metadata
        shell: bash
        run: |
          set -euo pipefail
          cd apps/desktop
          npm version 0.3.1 --no-git-tag-version
          cd ../..

          node <<'NODE'
          const fs = require('fs');

          const tauriPath = 'apps/desktop/src-tauri/tauri.conf.json';
          const tauri = JSON.parse(fs.readFileSync(tauriPath, 'utf8'));
          tauri.version = '0.3.1';
          fs.writeFileSync(tauriPath, JSON.stringify(tauri, null, 2) + '\n');

          const cargoPath = 'apps/desktop/src-tauri/Cargo.toml';
          let cargo = fs.readFileSync(cargoPath, 'utf8');
          if (!/^version\s*=\s*"0\.3\.0"/m.test(cargo)) throw new Error('Cargo.toml 0.3.0 version not found');
          cargo = cargo.replace(/^version\s*=\s*"0\.3\.0"/m, 'version = "0.3.1"');
          fs.writeFileSync(cargoPath, cargo);

          const authPath = 'apps/desktop/src/services/cloudAuth.ts';
          let auth = fs.readFileSync(authPath, 'utf8');
          if (!/const CLIENT_VERSION = "0\.3\.0";/.test(auth)) throw new Error('cloudAuth CLIENT_VERSION 0.3.0 not found');
          auth = auth.replace('const CLIENT_VERSION = "0.3.0";', 'const CLIENT_VERSION = "0.3.1";');
          fs.writeFileSync(authPath, auth);
          NODE

          cargo metadata --manifest-path apps/desktop/src-tauri/Cargo.toml --format-version 1 > /dev/null
          node scripts/check-version-consistency.mjs
          grep -A2 '^name = "lifetrace"$' apps/desktop/src-tauri/Cargo.lock | grep 'version = "0.3.1"'

      - name: Commit generated version bump and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-desktop-v031.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/package.json apps/desktop/package-lock.json apps/desktop/src-tauri/tauri.conf.json apps/desktop/src-tauri/Cargo.toml apps/desktop/src-tauri/Cargo.lock apps/desktop/src/services/cloudAuth.ts
          git commit -m "chore(release): bump desktop to 0.3.1"
          git push origin HEAD:release/desktop-v0.3.1
