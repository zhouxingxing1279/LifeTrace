name: EPIC-03 PostgreSQL

on:
  push:
    branches:
      - main
      - agent/epic-03-postgres-runtime
  pull_request:
    paths:
      - "services/lifetrace-cloud/**"
      - "crates/lifetrace-contracts/**"
      - "deploy/cloud/**"
      - "scripts/cloud/**"
      - ".github/workflows/epic03-postgres.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lifetrace
          POSTGRES_PASSWORD: lifetrace_test_password
          POSTGRES_DB: lifetrace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lifetrace -d lifetrace_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://lifetrace:lifetrace_test_password@127.0.0.1:5432/lifetrace_test
      TEST_DATABASE_URL: postgres://lifetrace:lifetrace_test_password@127.0.0.1:5432/lifetrace_test
      AUTH_PASSWORD_PEPPER: epic04-ci-password-pepper
      AUTH_TOKEN_HASH_PEPPER: epic04-ci-token-pepper
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            services/lifetrace-cloud
            crates/lifetrace-contracts
      - name: Format validation workspace
        run: cargo fmt --manifest-path services/lifetrace-cloud/Cargo.toml
      - name: Contract tests
        run: cargo test --manifest-path crates/lifetrace-contracts/Cargo.toml
      - name: Cloud tests
        run: cargo test --manifest-path services/lifetrace-cloud/Cargo.toml -- --test-threads=1
      - name: Clippy production targets
        run: cargo clippy --manifest-path services/lifetrace-cloud/Cargo.toml --lib --bins -- -D warnings
      - name: Docker build
        run: docker build -f services/lifetrace-cloud/Dockerfile .
      - name: Compose PostgreSQL smoke test
        env:
          COMPOSE_PROJECT_NAME: lifetrace-epic03-ci
          POSTGRES_HOST_PORT: "55432"
          CLOUD_HOST_PORT: "18787"
          POSTGRES_PASSWORD: lifetrace_compose_password
          DEV_AUTH_TOKEN: compose-dev-token
          CURSOR_SIGNING_KEY: compose-cursor-key
          PAGE_TOKEN_SIGNING_KEY: compose-page-key
        run: |
          set -euo pipefail
          compose_file="deploy/cloud/docker-compose.local.yml"
          docker compose -f "$compose_file" --profile cloud up -d --build --wait

          response="$(curl --fail --silent http://127.0.0.1:18787/health/ready)"
          echo "$response" | jq -e '
            .status == "ready" and
            .checks.storage == "postgresql" and
            .checks.postgresql == true
          '

          docker compose -f "$compose_file" --profile cloud restart lifetrace-cloud
          for attempt in $(seq 1 30); do
            if response="$(curl --fail --silent http://127.0.0.1:18787/health/ready 2>/dev/null)"; then
              echo "$response" | jq -e '
                .status == "ready" and
                .checks.storage == "postgresql" and
                .checks.postgresql == true
              '
              exit 0
            fi
            sleep 2
          done
          docker compose -f "$compose_file" --profile cloud logs
          exit 1
      - name: Stop Compose smoke environment
        if: always()
        env:
          COMPOSE_PROJECT_NAME: lifetrace-epic03-ci
          POSTGRES_HOST_PORT: "55432"
          CLOUD_HOST_PORT: "18787"
          POSTGRES_PASSWORD: lifetrace_compose_password
        run: docker compose -f deploy/cloud/docker-compose.local.yml --profile cloud down -v --remove-orphans
      - name: Upload resolved lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lifetrace-cloud-cargo-lock
          path: services/lifetrace-cloud/Cargo.lock
          if-no-files-found: error
