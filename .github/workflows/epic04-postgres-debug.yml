name: EPIC-04 PostgreSQL Diagnostic
# diagnostic-revision: 2

on:
  push:
    branches:
      - agent/epic-04-auth-complete
    paths:
      - '.github/workflows/epic04-postgres-debug.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lifetrace
          POSTGRES_PASSWORD: lifetrace_test_password
          POSTGRES_DB: lifetrace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lifetrace -d lifetrace_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://lifetrace:lifetrace_test_password@127.0.0.1:5432/lifetrace_test
      TEST_DATABASE_URL: postgres://lifetrace:lifetrace_test_password@127.0.0.1:5432/lifetrace_test
      AUTH_PASSWORD_PEPPER: epic04-test-password-pepper
      AUTH_TOKEN_HASH_PEPPER: epic04-test-token-pepper
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Apply EPIC-04
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip
          from pathlib import Path
          payload = ''.join(path.read_text() for path in sorted(Path('.epic04').glob('patch-*')))
          Path('/tmp/epic04.patch').write_bytes(gzip.decompress(base64.b64decode(payload)))
          PY
          git apply /tmp/epic04.patch
          python .epic04/apply-fix.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            services/lifetrace-cloud
            crates/lifetrace-contracts
          shared-key: epic04-postgres-diagnostic
      - name: Run and summarize PostgreSQL tests
        shell: bash
        run: |
          set +e
          cargo test --manifest-path services/lifetrace-cloud/Cargo.toml -- --test-threads=1 > /tmp/full.log 2>&1
          status=$?
          perl -pe 's/\e\[[0-9;]*[mK]//g' /tmp/full.log > /tmp/clean.log
          {
            echo "exit_status=$status"
            echo "=== FAILED TESTS ==="
            grep -E '^---- .* stdout ----$|^failures:$|^    [A-Za-z0-9_:]+$|test result: FAILED' /tmp/clean.log || true
            echo "=== ERRORS AND ASSERTIONS ==="
            grep -n -A20 -B8 -E 'panicked at|assertion `left == right` failed|Error:|Database\(|RowNotFound|violates|duplicate key|FOREIGN KEY|410 Gone|400 Bad Request|500 Internal Server Error' /tmp/clean.log | tail -700 || true
            echo "=== LOG TAIL ==="
            tail -350 /tmp/clean.log
          } > epic04-postgres-summary.txt
          cat epic04-postgres-summary.txt
          exit $status
      - name: Upload concise diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: epic04-postgres-summary
          path: epic04-postgres-summary.txt
          if-no-files-found: error
