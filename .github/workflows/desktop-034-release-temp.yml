name: Desktop 0.3.4 Release Prep (temporary)

on:
  push:
    branches:
      - release/desktop-0.3.4
    paths:
      - ".github/workflows/desktop-034-release-temp.yml"

permissions:
  contents: write

jobs:
  bump-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/desktop-0.3.4
          fetch-depth: 0

      - name: Bump Desktop metadata to 0.3.4
        shell: python
        run: |
          import json
          import pathlib
          import re

          root = pathlib.Path('.')
          desktop = root / 'apps' / 'desktop'
          version = '0.3.4'

          def write_json(path, mutate):
              data = json.loads(path.read_text(encoding='utf-8'))
              mutate(data)
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          write_json(desktop / 'package.json', lambda data: data.__setitem__('version', version))

          def bump_lock(data):
              data['version'] = version
              data.setdefault('packages', {}).setdefault('', {})['version'] = version
          write_json(desktop / 'package-lock.json', bump_lock)

          write_json(desktop / 'src-tauri' / 'tauri.conf.json', lambda data: data.__setitem__('version', version))

          cargo_toml = desktop / 'src-tauri' / 'Cargo.toml'
          text = cargo_toml.read_text(encoding='utf-8')
          text, count = re.subn(r'(?m)^(version\s*=\s*")0\.3\.3("\s*)$', rf'\g<1>{version}\2', text, count=1)
          if count != 1:
              raise SystemExit('failed to update Cargo.toml package version')
          cargo_toml.write_text(text, encoding='utf-8')

          cargo_lock = desktop / 'src-tauri' / 'Cargo.lock'
          text = cargo_lock.read_text(encoding='utf-8')
          old = 'name = "lifetrace"\nversion = "0.3.3"'
          new = f'name = "lifetrace"\nversion = "{version}"'
          if old not in text:
              raise SystemExit('failed to find lifetrace 0.3.3 in Cargo.lock')
          cargo_lock.write_text(text.replace(old, new, 1), encoding='utf-8')

          cloud_auth = desktop / 'src' / 'services' / 'cloudAuth.ts'
          text = cloud_auth.read_text(encoding='utf-8')
          text, count = re.subn(r'CLIENT_VERSION\s*=\s*"0\.3\.3"', f'CLIENT_VERSION = "{version}"', text, count=1)
          if count != 1:
              raise SystemExit('failed to update cloudAuth CLIENT_VERSION')
          cloud_auth.write_text(text, encoding='utf-8')

      - name: Verify version consistency
        run: node scripts/check-version-consistency.mjs

      - name: Commit release metadata and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/desktop-034-release-temp.yml
          git add apps/desktop/package.json apps/desktop/package-lock.json apps/desktop/src-tauri/tauri.conf.json apps/desktop/src-tauri/Cargo.toml apps/desktop/src-tauri/Cargo.lock apps/desktop/src/services/cloudAuth.ts
          git commit -m "chore(release): bump desktop to v0.3.4"
          git push origin HEAD:release/desktop-0.3.4
