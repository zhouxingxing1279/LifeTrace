name: EPIC-12 stabilize rustfmt once

on:
  push:
    branches:
      - agent/epic12-file-storage

permissions:
  contents: write

jobs:
  stabilize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/epic12-file-storage
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt
      - name: Stabilize expression, format and self-remove
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('services/cloud/src/routes/files.rs')
          text = path.read_text()
          old = '''            Self::NotesAttachment => matches!(
              mime.as_str(),
              "application/pdf"
                  | "text/plain"
                  | "text/markdown"
                  | "application/json"
                  | "application/msword"
                  | "application/vnd.openxmlformats-officedocument.wordprocessingml.document"
                  | "application/vnd.ms-excel"
                  | "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
                  | "application/vnd.ms-powerpoint"
                  | "application/vnd.openxmlformats-officedocument.presentationml.presentation"
                  | "audio/mpeg"
                  | "audio/mp4"
                  | "audio/wav"
                  | "audio/ogg"
                  | "audio/webm"
          ) || is_safe_image_mime(&mime),'''.replace('              ', '                ', 1).replace('              ', '                ', 1)
          # Use direct boundaries so the patch remains robust to rustfmt indentation details.
          start = text.index('            Self::NotesAttachment => matches!(')
          end_marker = '            Self::EnglishAudio => matches!('
          end = text.index(end_marker, start)
          block = text[start:end]
          prefix = '            Self::NotesAttachment => matches!('
          suffix = ') || is_safe_image_mime(&mime),\n'
          if not block.startswith(prefix) or not block.endswith(suffix):
              raise SystemExit('unexpected NotesAttachment formatting')
          inner = block[len(prefix):-len(suffix)]
          replacement = (
              '            Self::NotesAttachment => {\n'
              '                let supported_attachment = matches!(' + inner + ');\n'
              '                supported_attachment || is_safe_image_mime(&mime)\n'
              '            },\n'
          )
          path.write_text(text[:start] + replacement + text[end:])
          PY
          cargo fmt --manifest-path services/cloud/Cargo.toml
          rm .github/workflows/epic12-stabilize-format-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'style(epic12): stabilize rustfmt expression'
          git push origin HEAD:agent/epic12-file-storage
