name: Apply Local Vault Repairs

on:
  push:
    branches: [agent/local-encrypted-album]
    paths:
      - "tools/fix-vault-compile.py"
      - ".github/workflows/bootstrap-local-vault.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/local-encrypted-album
          fetch-depth: 0
      - name: Apply targeted repair
        run: python3 tools/fix-vault-compile.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt
      - name: Format Rust and update lockfile
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml
          cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/vault.rs src-tauri/Cargo.lock
          if git diff --cached --quiet; then
            echo "Repair already applied."
          else
            git commit -m "fix: compile local encrypted album"
            git push origin HEAD:agent/local-encrypted-album
          fi
