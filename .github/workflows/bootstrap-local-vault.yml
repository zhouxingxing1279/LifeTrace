name: Apply Complete Local Vault Implementation

on:
  push:
    branches: [agent/local-encrypted-album]
    paths:
      - "tools/local-vault-v2.part*"
      - ".github/workflows/bootstrap-local-vault.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/local-encrypted-album
          fetch-depth: 0
      - name: Expand complete private album implementation
        run: |
          cat tools/local-vault-v2.part* | base64 --decode > /tmp/local-vault-v2.zip
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('/tmp/local-vault-v2.zip') as archive:
              archive.extractall('.')
          PY
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt
      - name: Format Rust and update lockfile
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml
          cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
      - name: Commit complete implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/local-vault.css \
            src/components/LocalVaultModule.tsx src/types/electron.d.ts \
            src-tauri/src/vault.rs src-tauri/src/lib.rs src-tauri/Cargo.lock \
            tauri-ui/vaultBridge.ts
          if git diff --cached --quiet; then
            echo "Complete implementation already applied."
          else
            git commit -m "feat: complete local encrypted album workflows"
            git push origin HEAD:agent/local-encrypted-album
          fi
