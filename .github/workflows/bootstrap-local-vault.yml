name: Clean Local Vault Bootstrap Files

on:
  push:
    branches: [agent/local-encrypted-album]
    paths:
      - ".github/workflows/bootstrap-local-vault.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/local-encrypted-album
          fetch-depth: 0
      - name: Remove one-time implementation artifacts
        run: |
          rm -f tools/local-vault-patch.part* \
            tools/local-vault-v2.part* \
            tools/fix-vault-compile.py
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A tools
          if git diff --cached --quiet; then
            echo "No bootstrap artifacts remain."
          else
            git commit -m "chore: remove local vault bootstrap artifacts"
            git push origin HEAD:agent/local-encrypted-album
          fi
