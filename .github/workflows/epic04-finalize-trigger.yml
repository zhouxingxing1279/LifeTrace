name: EPIC-04 Final Validation Trigger
# dispatch-revision: 2

on:
  push:
    branches:
      - agent/epic-04-auth-complete
    paths:
      - '.github/workflows/epic04-finalize-trigger.yml'

permissions:
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch final validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            repos/${{ github.repository }}/actions/workflows/epic04-finalize.yml/dispatches \
            -f ref='agent/epic-04-auth-complete'
