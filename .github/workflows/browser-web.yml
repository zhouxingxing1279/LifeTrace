name: Browser Web

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "package.json"
      - "apps/photo-challenge-pwa/**"
      - "deploy/cloud/Dockerfile.web"
      - "deploy/cloud/Caddyfile.production"
      - "deploy/cloud/docker-compose.production.yml"
      - "deploy/cloud/docker-compose.wsl.yml"
      - "deploy/cloud/deploy-production.sh"
      - "services/cloud/**"
      - ".github/workflows/browser-web.yml"
      - ".github/workflows/web-image.yml"
  push:
    branches: [main, agent/web-redesign]
    paths:
      - "apps/web/**"
      - "package.json"
      - "apps/photo-challenge-pwa/**"
      - "deploy/cloud/Dockerfile.web"
      - "deploy/cloud/Caddyfile.production"
      - "deploy/cloud/docker-compose.production.yml"
      - "deploy/cloud/docker-compose.wsl.yml"
      - "deploy/cloud/deploy-production.sh"
      - "services/cloud/**"
      - ".github/workflows/browser-web.yml"
      - ".github/workflows/web-image.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: New Web typecheck, unit tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package.json
      - run: npm install --no-audit --no-fund
      - name: Enforce browser persistence boundary
        shell: bash
        run: |
          if grep -R -n -E 'localStorage[[:space:]]*\.|sessionStorage[[:space:]]*\.|indexedDB[[:space:]]*\.|IDBDatabase' src --exclude='*.test.ts' --exclude='VditorEditor.tsx'; then
            echo "Browser-local persistence is limited to the Vditor note draft cache"
            exit 1
          fi
          grep -q 'cache: { id: cacheKey, enable: true }' src/features/notes/VditorEditor.tsx
          if grep -R -n -E 'PhotoSync|LocalVault|photo-sync|local-vault|manifest\.webmanifest|serviceWorker|sw\.js' src package.json; then
            echo "Photo/PWA-only code must not enter the browser application"
            exit 1
          fi
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Verify browser artifact
        shell: bash
        run: |
          test -f dist/index.html
          test ! -e dist/manifest.webmanifest
          test ! -e dist/sw.js
          test -f dist/vendor/vditor/dist/js/lute/lute.min.js
          SIZE=$(du -sk dist | cut -f1)
          echo "dist size: ${SIZE} KB"
          test "$SIZE" -lt 20000
      - uses: actions/upload-artifact@v4
        with:
          name: lifetrace-browser-web
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 7

  cloud:
    name: Cloud assistant and auth regression
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lifetrace
          POSTGRES_PASSWORD: lifetrace_test_password
          POSTGRES_DB: lifetrace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lifetrace -d lifetrace_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://lifetrace:lifetrace_test_password@127.0.0.1:5432/lifetrace_test
      TEST_DATABASE_URL: postgres://lifetrace:lifetrace_test_password@127.0.0.1:5432/lifetrace_test
      AUTH_PASSWORD_PEPPER: browser-ci-password-pepper
      AUTH_TOKEN_HASH_PEPPER: browser-ci-token-pepper
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/cloud
      - name: Resolve dependencies and capture lockfile
        shell: bash
        run: cargo metadata --manifest-path services/cloud/Cargo.toml --format-version 1 > /dev/null
      - name: Format and verify Rust
        shell: bash
        run: |
          cargo fmt --manifest-path services/cloud/Cargo.toml
          git diff -- services/cloud/src services/cloud/Cargo.toml > rustfmt.patch
          if test -s rustfmt.patch; then
            cat rustfmt.patch
            exit 1
          fi
      - run: cargo test --manifest-path services/cloud/Cargo.toml -- --test-threads=1
      - run: cargo clippy --manifest-path services/cloud/Cargo.toml --all-targets -- -D warnings
      - name: Require committed dependency lockfile
        shell: bash
        run: git diff --exit-code -- services/cloud/Cargo.lock
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-cloud-diagnostics
          path: |
            rustfmt.patch
            services/cloud/src/routes/assistant.rs
            services/cloud/Cargo.lock
          if-no-files-found: warn
          retention-days: 7
