name: EPIC-04 Fast Handler Diagnostic

on:
  push:
    branches:
      - agent/epic-04-auth-complete
    paths:
      - '.github/workflows/epic04-handler-debug3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply staged implementation
        run: |
          python - <<'PY'
          import base64, gzip
          from pathlib import Path
          payload = ''.join(path.read_text() for path in sorted(Path('.epic04').glob('patch-*')))
          Path('/tmp/epic04.patch').write_bytes(gzip.decompress(base64.b64decode(payload)))
          PY
          git apply /tmp/epic04.patch
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/lifetrace-cloud
          shared-key: epic04-cloud-handler-debug
      - name: Add real Axum debug handler
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('services/lifetrace-cloud/src/routes/auth.rs')
          text = path.read_text()
          needle = 'async fn capabilities('
          if needle not in text:
              raise SystemExit('capabilities function not found')
          path.write_text(text.replace(needle, '#[axum::debug_handler]\nasync fn capabilities(', 1))
          PY
      - name: Compile and persist concise diagnostic
        shell: bash
        run: |
          set +e
          cargo check --manifest-path services/lifetrace-cloud/Cargo.toml > /tmp/full.log 2>&1
          status=$?
          perl -pe 's/\e\[[0-9;]*[mK]//g' /tmp/full.log > /tmp/clean.log
          {
            echo "exit_status=$status"
            grep -n -A30 -B12 -E 'future cannot be sent|error\[|error:|does not implement|not satisfied|IntoResponse|FromRequest|debug_handler' /tmp/clean.log | head -420
          } > /tmp/summary.txt
          git reset --hard HEAD
          git clean -fd
          cp /tmp/summary.txt epic04-handler-diagnostic-summary3.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add epic04-handler-diagnostic-summary3.txt
          git commit -m 'ci: capture fast EPIC-04 handler diagnostic' || true
          git push origin HEAD:agent/epic-04-auth-complete
          exit 0
