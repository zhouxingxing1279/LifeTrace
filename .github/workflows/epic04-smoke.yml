name: EPIC-04 Cloud Compile Smoke

on:
  push:
    branches:
      - agent/epic-04-auth-complete
    paths:
      - '.github/workflows/epic04-smoke.yml'
      - '.epic04/apply-fix.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cloud-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply staged EPIC-04 implementation
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip
          from pathlib import Path
          payload = ''.join(path.read_text() for path in sorted(Path('.epic04').glob('patch-*')))
          Path('/tmp/epic04.patch').write_bytes(gzip.decompress(base64.b64decode(payload)))
          PY
          git apply /tmp/epic04.patch
          python .epic04/apply-fix.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            services/lifetrace-cloud
            crates/lifetrace-contracts
      - name: Format check
        run: cargo fmt --manifest-path services/lifetrace-cloud/Cargo.toml -- --check
      - name: Cloud compile
        run: cargo check --manifest-path services/lifetrace-cloud/Cargo.toml --all-targets
