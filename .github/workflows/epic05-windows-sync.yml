name: EPIC-05 Windows Sync

on:
  push:
    branches:
      - main
      - agent/epic-05-windows-sync-core
    paths:
      - "crates/lifetrace-contracts/**"
      - "crates/lifetrace-sync-client/**"
      - "apps/desktop/src-tauri/**"
      - "apps/desktop/src/**"
      - "apps/desktop/tauri-ui/**"
      - "services/cloud/**"
      - "docs/epic-05/**"
      - "apps/desktop/package*.json"
      - "scripts/desktop/**"
      - "deploy-desktop.cmd"
      - ".github/workflows/epic05-windows-sync.yml"
  pull_request:
    paths:
      - "crates/lifetrace-contracts/**"
      - "crates/lifetrace-sync-client/**"
      - "apps/desktop/src-tauri/**"
      - "apps/desktop/src/**"
      - "apps/desktop/tauri-ui/**"
      - "services/cloud/**"
      - "docs/epic-05/**"
      - "apps/desktop/package*.json"
      - "scripts/desktop/**"
      - "deploy-desktop.cmd"
      - ".github/workflows/epic05-windows-sync.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-core-desktop-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail

          # GitHub-hosted Ubuntu runners can occasionally stall on the regional
          # Azure mirror. Prefer the canonical Ubuntu mirror and retry transient
          # package-index/download failures instead of failing the whole CI run.
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list 2>/dev/null || true
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null || true

          apt_retry() {
            local attempt
            for attempt in 1 2 3; do
              if sudo timeout 600s apt-get \
                -o Acquire::Retries=5 \
                -o Acquire::http::Timeout=30 \
                -o Acquire::https::Timeout=30 \
                -o Acquire::ForceIPv4=true \
                "$@"; then
                return 0
              fi

              if [ "$attempt" -eq 3 ]; then
                return 1
              fi

              echo "apt-get $* failed on attempt $attempt; retrying..."
              sleep $((attempt * 10))
            done
          }

          apt_retry update
          apt_retry install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Create required bundled dictionary resource
        run: |
          python3 - <<'PY'
          import sqlite3
          from pathlib import Path
          path = Path('apps/desktop/xunji_service/data/dictionary.db')
          path.parent.mkdir(parents=True, exist_ok=True)
          with sqlite3.connect(path) as db:
              db.execute('CREATE TABLE IF NOT EXISTS dictionary_meta (key TEXT PRIMARY KEY, value TEXT NOT NULL)')
          PY
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/lifetrace-contracts
            crates/lifetrace-sync-client
            apps/desktop/src-tauri
      - name: Rustfmt
        run: |
          cargo fmt --manifest-path crates/lifetrace-sync-client/Cargo.toml -- --check
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check
      - name: Contract tests
        run: cargo test --manifest-path crates/lifetrace-contracts/Cargo.toml
      - name: Pure sync core tests
        run: cargo test --manifest-path crates/lifetrace-sync-client/Cargo.toml --all-features
      - name: Desktop SQLite and adapter tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --lib -- --test-threads=1
      - name: Clippy pure sync core
        run: cargo clippy --manifest-path crates/lifetrace-sync-client/Cargo.toml --all-targets --all-features -- -D warnings
      - name: Clippy desktop library
        run: |
          cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --lib -- \
            -D warnings \
            -A dead_code \
            -A clippy::explicit_auto_deref \
            -A clippy::field_reassign_with_default \
            -A clippy::manual_async_fn \
            -A clippy::map_identity \
            -A clippy::needless_borrow \
            -A clippy::needless_question_mark \
            -A clippy::needless_range_loop \
            -A clippy::question_mark \
            -A clippy::redundant_closure \
            -A clippy::result_large_err \
            -A clippy::too_many_arguments \
            -A clippy::type_complexity \
            -A clippy::uninlined_format_args \
            -A clippy::unnecessary_lazy_evaluations
      - name: Frontend
        run: |
          npm ci --prefix apps/desktop
          npm run lint
          npm run test:unit
          npm run web:build

  cloud-postgresql:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lifetrace
          POSTGRES_PASSWORD: lifetrace_test_password
          POSTGRES_DB: lifetrace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lifetrace -d lifetrace_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://lifetrace:lifetrace_test_password@127.0.0.1:5432/lifetrace_test
      TEST_DATABASE_URL: postgres://lifetrace:lifetrace_test_password@127.0.0.1:5432/lifetrace_test
      AUTH_PASSWORD_PEPPER: epic05-ci-password-pepper
      AUTH_TOKEN_HASH_PEPPER: epic05-ci-token-pepper
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/cloud
      - name: Cloud PostgreSQL authentication, persistence and isolation regression
        run: cargo test --manifest-path services/cloud/Cargo.toml -- --test-threads=1

  windows-client:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Validate desktop deployment script
        shell: pwsh
        run: ./scripts/desktop/deploy-windows.ps1 -Mode Validate
      - name: Create required bundled dictionary resource
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force apps/desktop/xunji_service/data | Out-Null
          python -c "import sqlite3; db=sqlite3.connect(r'apps/desktop/xunji_service/data/dictionary.db'); db.execute('CREATE TABLE IF NOT EXISTS dictionary_meta (key TEXT PRIMARY KEY, value TEXT NOT NULL)'); db.close()"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/lifetrace-sync-client
            apps/desktop/src-tauri
      - name: Windows pure core and desktop tests
        run: |
          cargo test --manifest-path crates/lifetrace-sync-client/Cargo.toml --all-features
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --lib -- --test-threads=1
      - name: Windows frontend build
        run: |
          npm ci --prefix apps/desktop
          npm run web:build
