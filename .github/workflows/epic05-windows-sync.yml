name: EPIC-05 Windows Sync

on:
  pull_request:
    paths:
      - "crates/lifetrace-contracts/**"
      - "crates/lifetrace-sync-client/**"
      - "apps/desktop/src-tauri/**"
      - "services/cloud/**"
      - ".github/workflows/epic05-windows-sync.yml"

permissions:
  contents: read

jobs:
  diagnose-rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt
      - name: Capture rustfmt diff
        shell: bash
        run: |
          set +e
          {
            cargo fmt --manifest-path crates/lifetrace-sync-client/Cargo.toml -- --check
            a=$?
            cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check
            b=$?
            exit $(( a || b ))
          } 2>&1 | tee rustfmt.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            python3 - <<'PY'
          from pathlib import Path
          text = Path('rustfmt.log').read_text(errors='replace')[-20000:]
          text = text.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
          print(f'::error title=EPIC-05 rustfmt diff::{text}')
          PY
            exit "$status"
          fi
