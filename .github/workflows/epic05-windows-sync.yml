name: EPIC-05 Windows Sync

on:
  pull_request:
    paths:
      - "crates/lifetrace-contracts/**"
      - "crates/lifetrace-sync-client/**"
      - "apps/desktop/src-tauri/**"
      - "services/cloud/**"
      - ".github/workflows/epic05-windows-sync.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout PR head
        run: |
          git fetch origin "$GITHUB_HEAD_REF"
          git checkout -B "$GITHUB_HEAD_REF" FETCH_HEAD
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt
      - name: Apply exact EPIC-05 formatters
        run: |
          cargo fmt --manifest-path crates/lifetrace-sync-client/Cargo.toml
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Persist Rust formatting
        run: |
          if ! git diff --quiet HEAD -- ':(glob)**/*.rs'; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- ':(glob)**/*.rs'
            git commit -m "style: satisfy EPIC-05 rustfmt"
            git push origin "HEAD:$GITHUB_HEAD_REF"
          fi
