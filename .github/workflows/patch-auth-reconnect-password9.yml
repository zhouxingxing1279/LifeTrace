name: Patch auth reconnect password 9

on:
  push:
    branches:
      - fix/offline-auth-reconnect-password-9
    paths:
      - .github/workflows/patch-auth-reconnect-password9.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/offline-auth-reconnect-password-9
      - name: Apply password policy updates
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new, count=None):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              actual = text.count(old)
              if actual == 0:
                  raise SystemExit(f"pattern not found in {path}: {old!r}")
              if count is not None and actual != count:
                  raise SystemExit(f"expected {count} occurrences in {path}, found {actual}: {old!r}")
              p.write_text(text.replace(old, new), encoding="utf-8")

          replace(
              "apps/desktop/src/components/account/AccountEntry.tsx",
              "const passwordMinLength = auth.capabilities?.passwordMinLength ?? 15;",
              "const passwordMinLength = auth.capabilities?.passwordMinLength ?? 9;",
              1,
          )
          replace(
              "apps/desktop/src/components/account/AccountEntry.tsx",
              '      ? "离线 · 保持登录"',
              '      ? "离线 · 自动重连"',
              1,
          )
          replace(
              "apps/desktop/src/components/account/AccountSecurityPanel.tsx",
              "const minLength = auth.capabilities?.passwordMinLength ?? 15;",
              "const minLength = auth.capabilities?.passwordMinLength ?? 9;",
              1,
          )
          replace(
              "services/cloud/src/config.rs",
              "            auth_password_min_length: 15,",
              "            auth_password_min_length: 9,",
              1,
          )
          replace(
              "services/cloud/src/auth/password.rs",
              '        assert!(manager.hash("too short").is_err());\n        assert!(manager.hash("123456789012345").is_err());',
              '        assert!(manager.hash("Abc12!xy").is_err());\n        assert!(manager.hash("Abc123!xy").is_ok());\n        assert!(manager.hash("123456789012345").is_err());',
              1,
          )

          local_compose = Path("deploy/cloud/docker-compose.local.yml")
          text = local_compose.read_text(encoding="utf-8")
          marker = "      AUTH_REGISTRATION_MODE: ${AUTH_REGISTRATION_MODE:-disabled}\n"
          addition = marker + '      AUTH_PASSWORD_MIN_LENGTH: "${AUTH_PASSWORD_MIN_LENGTH:-9}"\n'
          if "AUTH_PASSWORD_MIN_LENGTH:" not in text:
              if marker not in text:
                  raise SystemExit("local compose auth registration marker not found")
              text = text.replace(marker, addition, 1)
              local_compose.write_text(text, encoding="utf-8")

          production = Path("deploy/cloud/docker-compose.production.example.yml")
          text = production.read_text(encoding="utf-8")
          marker = '      DEV_AUTH_ENABLED: "false"\n'
          addition = marker + '      AUTH_PASSWORD_MIN_LENGTH: "${AUTH_PASSWORD_MIN_LENGTH:-9}"\n'
          if "AUTH_PASSWORD_MIN_LENGTH:" not in text:
              if marker not in text:
                  raise SystemExit("production compose DEV_AUTH marker not found")
              text = text.replace(marker, addition, 1)
              production.write_text(text, encoding="utf-8")
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt
      - name: Format Rust
        run: cargo fmt --manifest-path services/cloud/Cargo.toml
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src/components/account/AccountEntry.tsx \
                  apps/desktop/src/components/account/AccountSecurityPanel.tsx \
                  services/cloud/src/config.rs \
                  services/cloud/src/auth/password.rs \
                  deploy/cloud/docker-compose.local.yml \
                  deploy/cloud/docker-compose.production.example.yml
          git commit -m "fix(auth): lower password minimum to 9 characters"
          git push origin HEAD:fix/offline-auth-reconnect-password-9
