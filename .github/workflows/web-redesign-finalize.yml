name: Finalize Web Redesign Cutover

on:
  push:
    branches:
      - agent/web-redesign
    paths:
      - '.github/workflows/web-redesign-finalize.yml'

permissions:
  contents: write

concurrency:
  group: finalize-web-redesign-cutover
  cancel-in-progress: false

jobs:
  remove-legacy-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout redesign branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove legacy browser client and record cutover
        shell: bash
        run: |
          set -euo pipefail
          rm -rf apps/desktop/web-client
          cat > apps/web/LEGACY_CUTOVER_DONE.md <<'EOF'
          # Legacy Web cutover complete

          The pre-deletion Web v2, Browser Web, and Web Container Image gates were green before this marker was created.

          `apps/desktop/web-client` has been removed. The production browser client is `apps/web`.
          EOF
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/ui/web-redesign-implementation.md')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '- legacy UI: retained only until all final cutover gates are green; then `apps/desktop/web-client` is deleted in the final cutover commit',
              '- legacy UI: removed after all pre-deletion Web gates were green; production browser UI is now `apps/web`',
          )
          text = text.replace(
              'The legacy directory is removed only after the latest-head versions of these gates are green. The PR is merged to `main` only after the post-deletion gates are also green.',
              'The legacy directory was removed only after the latest-head pre-deletion gates were green. The PR is merged to `main` only after the post-deletion gates are also green.',
          )
          path.write_text(text, encoding='utf-8')
          PY
          rm -f .github/workflows/web-redesign-finalize.yml

      - name: Commit cutover
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet --cached && git diff --quiet; then
            echo 'Nothing to finalize.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'web: remove legacy browser client after green gates'
          git push origin "HEAD:${GITHUB_REF_NAME}"
