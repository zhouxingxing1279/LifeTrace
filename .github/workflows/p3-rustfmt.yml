name: P3 Rustfmt

on:
  push:
    branches:
      - execution-workspace-p3
    paths:
      - "apps/desktop/src-tauri/**/*.rs"
      - ".github/workflows/p3-rustfmt.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
        with:
          ref: execution-workspace-p3
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt
      - name: Apply rustfmt
        run: cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Commit formatting only
        run: |
          if git diff --quiet -- src-tauri; then
            echo "Rust sources are already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri
          git commit -m "style(desktop): apply rustfmt"
          git push origin HEAD:execution-workspace-p3
