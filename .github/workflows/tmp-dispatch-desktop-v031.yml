name: Temporary Dispatch Desktop v0.3.1

on:
  push:
    branches:
      - ops/dispatch-desktop-v0.3.1

permissions:
  actions: write
  contents: write

jobs:
  dispatch-release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/dispatch-desktop-v0.3.1

      - name: Dispatch Windows release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release-windows.yml --repo zhouxingxing1279/LifeTrace --ref main -f version=0.3.1

      - name: Remove temporary dispatcher
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-dispatch-desktop-v031.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(ci): remove temporary desktop release dispatcher"
          git push origin HEAD:ops/dispatch-desktop-v0.3.1
