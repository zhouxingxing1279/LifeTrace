name: Temporary photo challenge INT4 score fix

on:
  push:
    branches:
      - fix/photo-challenge-int4-score

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/photo-challenge-int4-score
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt
      - name: Patch PostgreSQL INT4 score decoding
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('services/cloud/src/routes/photo_challenge.rs')
          text = path.read_text(encoding='utf-8')

          old = '        score: row.try_get("score").map_err(database_error)?,'
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'expected 2 score decode sites, found {count}')
          text = text.replace(old, '        score: read_db_score(row)?,')

          marker = '''fn response_from_row(\n    row: &sqlx::postgres::PgRow,\n    duplicate: bool,\n) -> Result<ScoreResponse, ApiError> {'''
          helper = '''fn read_db_score(row: &sqlx::postgres::PgRow) -> Result<i64, ApiError> {\n    // PostgreSQL migration 0020 defines photo_challenge_scores.score as INTEGER (INT4).\n    // Decode with the matching Rust type first, then widen for the public API model.\n    row.try_get::<i32, _>("score")\n        .map(i64::from)\n        .map_err(database_error)\n}\n\n'''
          if marker not in text:
              raise SystemExit('response_from_row marker not found')
          text = text.replace(marker, helper + marker, 1)

          test_marker = '''    #[test]\n    fn model_total_is_derived_from_rubric_parts() {'''
          test = '''    #[test]\n    fn int4_score_widens_losslessly_for_api() {\n        let db_score: i32 = 93;\n        let api_score = i64::from(db_score);\n        assert_eq!(api_score, 93_i64);\n    }\n\n'''
          if test_marker not in text:
              raise SystemExit('test marker not found')
          text = text.replace(test_marker, test + test_marker, 1)

          path.write_text(text, encoding='utf-8')
          PY
          cargo fmt --manifest-path services/cloud/Cargo.toml
          cargo test --manifest-path services/cloud/Cargo.toml routes::photo_challenge::tests -- --test-threads=1
      - name: Commit patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add services/cloud/src/routes/photo_challenge.rs
          git commit -m "fix: decode photo challenge score as PostgreSQL INT4"
          git push origin HEAD:fix/photo-challenge-int4-score
