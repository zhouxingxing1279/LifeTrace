name: EPIC-27 Mail UI Fix 2

on:
  push:
    branches: ["agent/epic27-mail-ui"]
    paths: [".github/workflows/epic27-mail-ui-fix2.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/epic27-mail-ui
          fetch-depth: 0
      - name: Patch sender navigation narrowing
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/desktop/src/components/feature/mail/MailActionCenter.tsx')
          text = path.read_text()
          start_marker = '  const activeSenderGroup = screen.kind === "sender"'
          end_marker = '\n\n  const loadAccounts = useCallback'
          if start_marker in text:
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              replacement = '''  const activeSenderKey = screen.kind === "sender"
            ? screen.senderKey
            : screen.kind === "detail" && screen.back.kind === "sender"
              ? screen.back.senderKey
              : null;
          const activeSenderGroup = activeSenderKey
            ? senderGroups.find((group) => group.key === activeSenderKey) || null
            : null;'''
              path.write_text(text[:start] + replacement + text[end:])
          elif 'const activeSenderKey = screen.kind === "sender"' not in text:
              raise SystemExit('sender navigation block not found')
          PY
      - name: Commit patch and remove helpers
        run: |
          rm -f .github/workflows/epic27-mail-ui-fix.yml .github/workflows/epic27-mail-ui-fix2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src/components/feature/mail/MailActionCenter.tsx .github/workflows/epic27-mail-ui-fix.yml .github/workflows/epic27-mail-ui-fix2.yml
          git commit -m "fix(mail): narrow sender navigation state"
          git push origin HEAD:agent/epic27-mail-ui
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Verify frontend typecheck
        working-directory: apps/desktop
        run: |
          npm ci
          npm run lint
