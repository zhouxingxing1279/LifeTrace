name: Desktop Web v2 Sync

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "apps/desktop/src/**"
      - "apps/desktop/tauri-ui/**"
      - "apps/desktop/tests/**"
      - "apps/desktop/tsconfig.json"
      - "apps/desktop/vite.tauri.config.ts"
      - ".github/workflows/desktop-web-v2-sync.yml"
  push:
    branches:
      - main
    paths:
      - "apps/web/**"
      - "apps/desktop/src/**"
      - "apps/desktop/tauri-ui/**"
      - "apps/desktop/tests/**"
      - "apps/desktop/tsconfig.json"
      - "apps/desktop/vite.tauri.config.ts"
      - ".github/workflows/desktop-web-v2-sync.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-shared-web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/desktop/package-lock.json
            apps/web/package-lock.json
      - name: Install desktop dependencies
        run: npm ci --prefix apps/desktop
      - name: Install shared Web dependencies
        run: npm ci --prefix apps/web
      - name: Desktop typecheck
        run: npm --prefix apps/desktop run lint
      - name: Desktop unit tests
        run: npm --prefix apps/desktop run test:unit
      - name: Tauri frontend production build
        run: npm --prefix apps/desktop run web:build
