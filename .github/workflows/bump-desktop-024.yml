name: Bump desktop 0.2.4 metadata

on:
  push:
    branches:
      - release/bump-desktop-0.2.4
    paths:
      - .github/workflows/bump-desktop-024.yml

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/bump-desktop-0.2.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - name: Bump all desktop version metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re

          tauri = Path('apps/desktop/src-tauri/tauri.conf.json')
          data = json.loads(tauri.read_text(encoding='utf-8'))
          data['version'] = '0.2.4'
          tauri.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          cargo = Path('apps/desktop/src-tauri/Cargo.toml')
          text = cargo.read_text(encoding='utf-8')
          text, count = re.subn(r'(?m)^version\s*=\s*"[^"]+"', 'version = "0.2.4"', text, count=1)
          if count != 1:
              raise SystemExit('failed to update Cargo.toml package version')
          cargo.write_text(text, encoding='utf-8')
          PY

          cd apps/desktop
          npm version 0.2.4 --no-git-tag-version --allow-same-version
          cd src-tauri
          cargo update -p lifetrace --precise 0.2.4
          cd ../../..
          node scripts/check-version-consistency.mjs

      - name: Commit version bump
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/package.json apps/desktop/package-lock.json apps/desktop/src-tauri/tauri.conf.json apps/desktop/src-tauri/Cargo.toml apps/desktop/src-tauri/Cargo.lock
          git commit -m "chore: bump desktop version to 0.2.4"
          git push origin HEAD:release/bump-desktop-0.2.4
