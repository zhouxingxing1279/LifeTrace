name: EPIC-04 Contracts Clippy Diagnostic
# diagnostic-revision: 2

on:
  push:
    branches:
      - agent/epic-04-auth-complete
    paths:
      - '.github/workflows/epic04-clippy-debug.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply EPIC-04
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip
          from pathlib import Path
          payload = ''.join(path.read_text() for path in sorted(Path('.epic04').glob('patch-*')))
          Path('/tmp/epic04.patch').write_bytes(gzip.decompress(base64.b64decode(payload)))
          PY
          git apply /tmp/epic04.patch
          python .epic04/apply-fix.py
          python .epic04/apply-contract-fix.py
          python .epic04/apply-clippy-fix.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/lifetrace-contracts
          shared-key: epic04-contracts-clippy-diagnostic
      - name: Format contracts
        run: cargo fmt --manifest-path crates/lifetrace-contracts/Cargo.toml
      - name: Run and summarize Clippy
        shell: bash
        run: |
          set +e
          cargo clippy --manifest-path crates/lifetrace-contracts/Cargo.toml --all-targets -- -D warnings > /tmp/clippy.log 2>&1
          status=$?
          perl -pe 's/\e\[[0-9;]*[mK]//g' /tmp/clippy.log > /tmp/clean.log
          {
            echo "exit_status=$status"
            grep -n -A24 -B12 -E '^error:|warning:|clippy::|help:|--> .*\.rs:' /tmp/clean.log | tail -900 || true
            echo "=== LOG TAIL ==="
            tail -300 /tmp/clean.log
          } > epic04-clippy-summary.txt
          cat epic04-clippy-summary.txt
          exit $status
      - name: Upload concise diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: epic04-clippy-summary
          path: epic04-clippy-summary.txt
          if-no-files-found: error
