name: EPIC-27 Protocol Clippy Fix

on:
  push:
    branches: ["agent/epic27-mail-ui"]
    paths: [".github/workflows/epic27-protocol-clippy-fix.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/epic27-mail-ui
          fetch-depth: 0
      - name: Bring current main protocol implementation and move tests to file end
        run: |
          git fetch origin main
          git checkout origin/main -- services/cloud/src/mail/protocol.rs
          python - <<'PY'
          from pathlib import Path
          path = Path('services/cloud/src/mail/protocol.rs')
          text = path.read_text()
          marker = '#[cfg(test)]\nmod tests {'
          start = text.index(marker)
          depth = 0
          opened = False
          end = None
          for index in range(start, len(text)):
              char = text[index]
              if char == '{':
                  depth += 1
                  opened = True
              elif char == '}':
                  depth -= 1
                  if opened and depth == 0:
                      end = index + 1
                      break
          if end is None:
              raise SystemExit('test module end not found')
          block = text[start:end].strip()
          remaining = (text[:start] + text[end:]).rstrip()
          path.write_text(remaining + '\n\n' + block + '\n')
          PY
          cargo fmt --manifest-path services/cloud/Cargo.toml
      - name: Commit fix and remove helper
        run: |
          rm .github/workflows/epic27-protocol-clippy-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(mail): keep protocol tests after production items"
          git push origin HEAD:agent/epic27-mail-ui
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - name: Verify cloud clippy
        run: cargo clippy --manifest-path services/cloud/Cargo.toml --all-targets -- -D warnings
