name: UI Preview Pages

on:
  push:
    branches: [ui-review]
    paths:
      - "apps/desktop/tauri-ui/**"
      - "apps/desktop/src/**"
      - "apps/desktop/app/**"
      - "apps/desktop/public/**"
      - "apps/desktop/vite.ui-preview.config.ts"
      - "apps/desktop/package.json"
      - "apps/desktop/package-lock.json"
      - "package.json"
      - ".github/workflows/ui-preview-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: lifetrace-ui-preview-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Build desktop UI Preview
        env:
          LIFETRACE_UI_BASE: /LifeTrace/
        run: npm run ui:build

      - name: Verify Preview artifact
        run: |
          test -f dist-ui-preview/index.html
          test -d dist-ui-preview/assets

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/desktop/dist-ui-preview

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy UI Preview
        id: deployment
        uses: actions/deploy-pages@v4
