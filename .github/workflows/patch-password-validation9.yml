name: Patch cloud password validation 9

on:
  push:
    branches:
      - fix/offline-auth-reconnect-password-9
    paths:
      - .github/workflows/patch-password-validation9.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/offline-auth-reconnect-password-9
      - name: Align config validation and tests
        shell: python
        run: |
          from pathlib import Path
          path = Path("services/cloud/src/config.rs")
          text = path.read_text(encoding="utf-8")
          old = '''        if self.auth_password_min_length < 15 || self.auth_password_max_bytes < 64 {
                      return Err("password policy is weaker than the EPIC-04 minimum".to_owned());
                  }
          '''
          new = '''        if self.auth_password_min_length < 9 || self.auth_password_max_bytes < 64 {
                      return Err("AUTH_PASSWORD_MIN_LENGTH must be at least 9 Unicode characters".to_owned());
                  }
          '''
          if old not in text:
              raise SystemExit("password policy validation block not found")
          text = text.replace(old, new, 1)
          marker = '''    #[test]
              fn production_fails_closed_without_auth_secrets() {
          '''
          addition = '''    #[test]
              fn password_policy_rejects_minimum_below_nine() {
                  let config = Config {
                      database_url: Some("postgres://user:password@localhost/lifetrace".to_owned()),
                      auth_password_min_length: 8,
                      ..Config::default()
                  };
                  assert!(config
                      .validate()
                      .unwrap_err()
                      .contains("at least 9 Unicode characters"));
              }

          ''' + marker
          if marker not in text:
              raise SystemExit("config test insertion marker not found")
          text = text.replace(marker, addition, 1)
          path.write_text(text, encoding="utf-8")
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt
      - name: Format Rust
        run: cargo fmt --manifest-path services/cloud/Cargo.toml
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/cloud/src/config.rs
          git commit -m "fix(auth): allow 9-character cloud password minimum"
          git push origin HEAD:fix/offline-auth-reconnect-password-9
