name: Format storage branch

on:
  push:
    branches:
      - feat/storage-location-migration
    paths:
      - .github/workflows/format-storage-branch.yml
      - apps/desktop/src-tauri/src/storage.rs

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/storage-location-migration
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt
      - name: Format desktop Rust
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet -- apps/desktop/src-tauri/src/storage.rs; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src-tauri/src/storage.rs
          git commit -m "style: rustfmt storage migration"
          git push origin HEAD:feat/storage-location-migration
