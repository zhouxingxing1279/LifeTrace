name: Photo Challenge Branch Validation

on:
  push:
    branches: [feat/photo-challenge-pwa]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: photo-challenge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cloud-and-web:
    name: Cloud, browser web and PWA
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Apply final photo staging semantics and rustfmt
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("services/cloud/src/routes/photo_staging.rs")
          text = path.read_text(encoding="utf-8")

          replacements = [
              ("const DEFAULT_TTL_HOURS: i64 = 72;\n", ""),
              ("pub expires_at: DateTime<Utc>,", "pub expires_at: Option<DateTime<Utc>>,"),
              (" AND expires_at>now()", ""),
              (
                  '''    let ttl_hours = std::env::var("PHOTO_STAGING_TTL_HOURS")\n        .ok()\n        .and_then(|value| value.parse::<i64>().ok())\n        .unwrap_or(DEFAULT_TTL_HOURS)\n        .clamp(1, 24 * 30);\n    let expires_at = Utc::now() + Duration::hours(ttl_hours);''',
                  '''    // No expiry by default: an original remains staged until the desktop\n    // confirms that the existing local photo library committed it. Operators\n    // may explicitly configure a positive TTL for other relay deployments.\n    let expires_at = std::env::var("PHOTO_STAGING_TTL_HOURS")\n        .ok()\n        .map(|value| value.trim().to_owned())\n        .filter(|value| !value.is_empty())\n        .and_then(|value| value.parse::<i64>().ok())\n        .filter(|hours| *hours > 0)\n        .map(|hours| Utc::now() + Duration::hours(hours.min(24 * 3650)));'''
              ),
              (
                  '"DELETE FROM photo_staging_items WHERE expires_at<=now() RETURNING storage_name",',
                  '"DELETE FROM photo_staging_items WHERE expires_at IS NOT NULL AND expires_at<=now() RETURNING storage_name",'
              ),
              ('"暂存照片不存在或已过期",', '"暂存照片不存在或已被清除",'),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"expected source fragment missing: {old[:100]!r}")
              text = text.replace(old, new)

          marker = "    ensure_database(&state)?;\n    let user_id = user_uuid(&principal.user_id)?;"
          count = text.count(marker)
          if count != 3:
              raise SystemExit(f"expected metadata/content/ack marker three times, found {count}")
          text = text.replace(
              marker,
              "    ensure_database(&state)?;\n    cleanup_expired(&state).await?;\n    let user_id = user_uuid(&principal.user_id)?;",
          )

          path.write_text(text, encoding="utf-8")
          PY
          rustfmt --edition 2021 \
            services/cloud/src/lib.rs \
            services/cloud/src/routes/mod.rs \
            services/cloud/src/routes/photo_staging.rs \
            services/cloud/src/routes/photo_challenge.rs \
            apps/desktop/src-tauri/src/lib.rs \
            apps/desktop/src-tauri/src/sync/mod.rs \
            apps/desktop/src-tauri/src/sync/photo_staging.rs
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add services/cloud/src/routes/photo_staging.rs
            git commit -m "fix: retain staged photos until desktop acknowledgement"
            git push origin HEAD:feat/photo-challenge-pwa
          fi
      - name: Verify changed Rust files are formatted
        shell: bash
        run: |
          rustfmt --edition 2021 --check \
            services/cloud/src/lib.rs \
            services/cloud/src/routes/mod.rs \
            services/cloud/src/routes/photo_staging.rs \
            services/cloud/src/routes/photo_challenge.rs \
            apps/desktop/src-tauri/src/lib.rs \
            apps/desktop/src-tauri/src/sync/mod.rs \
            apps/desktop/src-tauri/src/sync/photo_staging.rs
      - name: Cloud compile
        run: cargo check --locked --manifest-path services/cloud/Cargo.toml
      - name: Photo challenge unit tests
        run: cargo test --locked --manifest-path services/cloud/Cargo.toml --lib routes::photo_challenge::tests
      - name: Cloud clippy
        run: cargo clippy --locked --manifest-path services/cloud/Cargo.toml --lib -- -D warnings
      - name: Browser dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Enforce browser cloud-only and no-photo boundaries
        working-directory: apps/desktop
        shell: bash
        run: |
          if grep -R -n -E 'localStorage[[:space:]]*\.|sessionStorage[[:space:]]*\.|indexedDB[[:space:]]*\.|IDBDatabase' web-client/src; then
            echo "Business data must not be persisted in browser storage"
            exit 1
          fi
          if grep -R -n -E 'PhotoSync|LocalVault|photo-sync|local-vault|manifest\.webmanifest|serviceWorker|sw\.js' web-client vite.browser.config.ts package.json; then
            echo "Photo/PWA-only code must not enter the browser application"
            exit 1
          fi
      - name: Browser lint
        working-directory: apps/desktop
        run: npm run lint
      - name: Browser unit tests
        working-directory: apps/desktop
        run: npm run test:unit
      - name: Browser build
        working-directory: apps/desktop
        run: npm run browser:build
      - name: Validate standalone PWA files
        shell: bash
        run: |
          test -f apps/photo-challenge-pwa/index.html
          test -f apps/photo-challenge-pwa/app.js
          test -f apps/photo-challenge-pwa/styles.css
          test -f apps/photo-challenge-pwa/manifest.webmanifest
          test -f apps/photo-challenge-pwa/sw.js
          python -m json.tool apps/photo-challenge-pwa/manifest.webmanifest >/dev/null
          grep -q 'photo-challenge-upload' apps/photo-challenge-pwa/manifest.webmanifest
          grep -q '/api/v1/photo-challenge/score' apps/photo-challenge-pwa/app.js

  desktop-rust:
    name: Desktop Tauri compile
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Desktop cargo check
        run: cargo check --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
