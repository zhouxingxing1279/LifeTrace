name: Temporary Dispatch Desktop v0.3.2

on:
  push:
    branches:
      - ops/dispatch-desktop-v0.3.2

permissions:
  actions: write
  contents: write

jobs:
  dispatch-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/dispatch-desktop-v0.3.2
          fetch-depth: 0

      - name: Dispatch Windows release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release-windows.yml --ref main -f version=0.3.2

      - name: Remove temporary dispatcher
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-dispatch-desktop-v0.3.2.yml
          git commit -m "chore(release): remove temporary v0.3.2 dispatcher"
          git push origin HEAD:ops/dispatch-desktop-v0.3.2
