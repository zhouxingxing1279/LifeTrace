name: EPIC-04 Handler Diagnostic
# diagnostic-revision: 3

on:
  push:
    branches:
      - agent/epic-04-auth-complete
    paths:
      - '.github/workflows/epic04-handler-debug.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply staged implementation
        run: |
          python - <<'PY'
          import base64, gzip
          from pathlib import Path
          payload = ''.join(path.read_text() for path in sorted(Path('.epic04').glob('patch-*')))
          Path('/tmp/epic04.patch').write_bytes(gzip.decompress(base64.b64decode(payload)))
          PY
          git apply /tmp/epic04.patch
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - name: Add Axum debug handler
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('services/lifetrace-cloud/src/routes/auth.rs')
          text = path.read_text()
          text = text.replace('pub async fn capabilities(', '#[axum::debug_handler]\npub async fn capabilities(', 1)
          path.write_text(text)
          PY
      - name: Compile and capture diagnostic
        shell: bash
        run: |
          set +e
          cargo check --manifest-path services/lifetrace-cloud/Cargo.toml > /tmp/epic04-handler-diagnostic.log 2>&1
          status=$?
          echo "exit_status=$status" >> /tmp/epic04-handler-diagnostic.log
          git reset --hard HEAD
          git clean -fd
          cp /tmp/epic04-handler-diagnostic.log epic04-handler-diagnostic.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add epic04-handler-diagnostic.log
          git commit -m 'ci: capture EPIC-04 handler diagnostic'
          git push origin HEAD:agent/epic-04-auth-complete
          exit 0
