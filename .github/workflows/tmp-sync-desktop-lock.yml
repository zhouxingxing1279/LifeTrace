name: Temporary Desktop Lock Sync

on:
  push:
    branches:
      - fix/desktop-login-diagnostics-v029
    paths:
      - ".github/workflows/tmp-sync-desktop-lock.yml"

permissions:
  contents: write

jobs:
  sync-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/desktop-login-diagnostics-v029
          fetch-depth: 0
      - name: Update only the LifeTrace root package version
        shell: python
        run: |
          from pathlib import Path
          path = Path("apps/desktop/src-tauri/Cargo.lock")
          before = path.read_text(encoding="utf-8")
          old = '[[package]]\nname = "lifetrace"\nversion = "0.2.8"\n'
          new = '[[package]]\nname = "lifetrace"\nversion = "0.2.9"\n'
          if before.count(old) != 1:
              raise SystemExit(f"expected exactly one LifeTrace 0.2.8 root package entry, found {before.count(old)}")
          after = before.replace(old, new, 1)
          if after.replace(new, old, 1) != before:
              raise SystemExit("lockfile guard failed: unexpected content change")
          path.write_text(after, encoding="utf-8", newline="\n")
      - name: Verify diff is exactly the root package version bump
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --numstat -- apps/desktop/src-tauri/Cargo.lock)" = $'1\t1\tapps/desktop/src-tauri/Cargo.lock'
          git diff -- apps/desktop/src-tauri/Cargo.lock | grep -F -- '-version = "0.2.8"'
          git diff -- apps/desktop/src-tauri/Cargo.lock | grep -F -- '+version = "0.2.9"'
      - name: Commit synchronized lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src-tauri/Cargo.lock
          git commit -m "chore(desktop): sync Cargo.lock for 0.2.9"
          git push origin HEAD:fix/desktop-login-diagnostics-v029
