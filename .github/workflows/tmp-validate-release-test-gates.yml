name: Temporary Validate Release Test Gates

on:
  push:
    branches:
      - ops/validate-release-test-gates

permissions:
  actions: write
  contents: write

jobs:
  dispatch-validation:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/validate-release-test-gates

      - name: Dispatch EPIC-05 on release gate fix branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run epic05-windows-sync.yml --repo zhouxingxing1279/LifeTrace --ref fix/release-test-gates

      - name: Remove temporary dispatcher
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-validate-release-test-gates.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(ci): remove temporary release validation dispatcher"
          git push origin HEAD:ops/validate-release-test-gates
