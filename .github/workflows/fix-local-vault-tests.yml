name: Fix Local Vault Test Workspace

on:
  push:
    branches: [agent/local-encrypted-album]
    paths:
      - ".github/workflows/fix-local-vault-tests.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/local-encrypted-album
          fetch-depth: 0
      - name: Apply focused test and warning fixes
        run: |
          python3 tools/fix-local-vault-tests.py
          cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/vault.rs
          git commit -m "test: isolate private vault fixtures from vault storage"
          git push origin HEAD:agent/local-encrypted-album
