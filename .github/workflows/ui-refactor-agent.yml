name: UI Refactor Agent

on:
  push:
    branches:
      - agent/ui-redesign
    paths:
      - "scripts/apply_ui_refactor.py"
      - ".github/workflows/ui-refactor-agent.yml"
      - "app/**"
      - "src/**"
      - "tauri-ui/**"
      - "tests/**"
      - "tsconfig.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ui-refactor-agent-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_BUILD_JOBS: "2"
  RUSTFLAGS: "-C debuginfo=0"

jobs:
  refactor-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ui-redesign
          fetch-depth: 0

      - name: Reclaim runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
          df -h

      - name: Install Tauri Linux dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo timeout 240s apt-get update -o Acquire::Retries=3
          sudo timeout 240s apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Create required bundled dictionary resource
        run: |
          python3 - <<'PY'
          import sqlite3
          from pathlib import Path
          path = Path('xunji_service/data/dictionary.db')
          path.parent.mkdir(parents=True, exist_ok=True)
          with sqlite3.connect(path) as db:
              db.execute('CREATE TABLE IF NOT EXISTS dictionary_meta (key TEXT PRIMARY KEY, value TEXT NOT NULL)')
          PY

      - name: Apply deterministic UI refactor
        run: python3 scripts/apply_ui_refactor.py

      - name: Apply generated compatibility fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/ui/feedback/confirm.tsx')
          text = path.read_text(encoding='utf-8')
          old = '    return () => listeners.delete(listener);'
          new = '    return () => {\n      listeners.delete(listener);\n    };'
          if old in text:
              path.write_text(text.replace(old, new), encoding='utf-8')
          elif new not in text:
              raise SystemExit('confirm cleanup pattern not found')
          PY
          sed -i 's/[[:space:]]\+$//' src/components/HengXuShell.tsx

      - name: Check generated patch formatting
        run: git diff --check

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck, unit tests and web builds
        run: npm test

      - name: Rust desktop regression tests
        id: rust-tests
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm run test:rust 2>&1 | tee /tmp/rust-test.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          mkdir -p docs/ui-redesign
          {
            echo "# Rust test failure diagnostic"
            echo
            echo "Workflow run: $GITHUB_RUN_ID"
            echo "Commit: $GITHUB_SHA"
            echo "Exit status: $status"
            echo
            echo '```text'
            tail -n 500 /tmp/rust-test.log
            echo '```'
          } > docs/ui-redesign/RUST_TEST_FAILURE.md
          exit "$status"

      - name: Commit Rust diagnostics
        if: always() && steps.rust-tests.outputs.status != '0'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ui-redesign/RUST_TEST_FAILURE.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: capture Rust test failure"
            git push origin HEAD:agent/ui-redesign
          fi

      - name: Stop after Rust failure
        if: always() && steps.rust-tests.outputs.status != '0'
        run: exit 1

      - name: Remove stale Rust diagnostic
        if: steps.rust-tests.outputs.status == '0'
        run: rm -f docs/ui-redesign/RUST_TEST_FAILURE.md

      - name: Tauri production build
        if: steps.rust-tests.outputs.status == '0'
        run: npm run build

      - name: Commit generated refactor
        id: commit
        if: steps.rust-tests.outputs.status == '0'
        shell: bash
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app src tauri-ui tests tsconfig.json docs/ui-redesign
          git commit -m "refactor: unify user UI and context actions"
          git push origin HEAD:agent/ui-redesign
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Validation summary
        if: steps.rust-tests.outputs.status == '0'
        run: |
          echo "UI refactor validated. Generated commit: ${{ steps.commit.outputs.changed }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Checks: npm test, npm run test:rust, npm run build" >> "$GITHUB_STEP_SUMMARY"
