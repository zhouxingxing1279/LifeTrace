name: EPIC-12 clippy cleanup once

on:
  push:
    branches:
      - agent/epic12-file-storage

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/epic12-file-storage
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt
      - name: Remove dead FileRecord field and self-remove
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('services/cloud/src/routes/files.rs')
          text = path.read_text()
          text = text.replace(
              'struct FileRecord {\n    metadata: FileMetadata,\n    object_key: String,\n    storage_cleanup_pending: bool,\n}',
              'struct FileRecord {\n    metadata: FileMetadata,\n    object_key: String,\n}',
              1,
          )
          text = text.replace(
              '        storage_cleanup_pending: row\n            .try_get("storage_cleanup_pending")\n            .map_err(database_error)?,\n',
              '',
              1,
          )
          path.write_text(text)
          PY
          cargo fmt --manifest-path services/cloud/Cargo.toml
          rm .github/workflows/epic12-clippy-fix-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(epic12): satisfy cloud clippy'
          git push origin HEAD:agent/epic12-file-storage
