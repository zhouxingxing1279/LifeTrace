name: EPIC20 Phase7B Clean Export

on:
  push:
    branches:
      - agent/epic20-phase7b-sync-e2e

permissions:
  contents: write

jobs:
  export-clean-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/epic20-phase7b-sync-e2e
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt
      - name: Apply Phase 7B patch
        shell: bash
        run: |
          python tools/epic20_phase7b_patch.py
          python tools/epic20_phase7b_fix_tests.py
      - name: Format Phase 7B sources
        shell: bash
        run: |
          cargo fmt --manifest-path crates/lifetrace-contracts/Cargo.toml
          cargo fmt --manifest-path services/cloud/Cargo.toml
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Export clean branch
        shell: bash
        run: |
          git fetch origin main
          git diff --binary origin/main -- \
            crates/lifetrace-contracts/src/domain/payload.rs \
            services/cloud/tests/api.rs \
            apps/desktop/src-tauri/src/sync/execution.rs \
            > /tmp/phase7b.patch
          git reset --hard HEAD
          git clean -fd
          git checkout -B agent/epic20-phase7b-sync-e2e-clean origin/main
          git apply --index /tmp/phase7b.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(epic20): validate execution sync end to end"
          git push --force origin HEAD:agent/epic20-phase7b-sync-e2e-clean
