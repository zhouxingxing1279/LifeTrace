name: EPIC-27 CI Fix

on:
  push:
    branches:
      - agent/epic27-mail-foundation

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, '[run-epic27-ci-fix]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/epic27-mail-foundation
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt
      - name: Apply exact fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          protocol = Path("services/cloud/src/mail/protocol.rs")
          text = protocol.read_text()
          old = "        let outcome = session\n            .idle()\n            .wait_with_timeout(timeout)\n            .map_err(|_| MailProtocolError::Connect)?;\n        let changed = matches!(outcome, imap::extensions::idle::WaitOutcome::MailboxChanged);\n"
          new = "        let outcome = {\n            let mut idle = session.idle();\n            idle.timeout(timeout).keepalive(false);\n            idle.wait_while(imap::extensions::idle::stop_on_any)\n                .map_err(|_| MailProtocolError::Connect)?\n        };\n        let changed = matches!(outcome, imap::extensions::idle::WaitOutcome::MailboxChanged);\n"
          if old not in text:
              raise SystemExit("expected protocol block not found")
          protocol.write_text(text.replace(old, new, 1))

          service = Path("services/cloud/src/mail/service.rs")
          text = service.read_text()
          old = "    MailAttachment, MailFolder, MailListQuery, MailMessage, MailProvider, MailSecurity, MailThread,\n"
          new = "    MailAttachment, MailFolder, MailListQuery, MailMessage, MailSecurity, MailThread,\n"
          if old not in text:
              raise SystemExit("expected service import not found")
          service.write_text(text.replace(old, new, 1))
          PY
      - name: Format cloud Rust
        run: cargo fmt --manifest-path services/cloud/Cargo.toml
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/cloud/src/mail/protocol.rs services/cloud/src/mail/service.rs
          git commit -m "fix(epic27): adapt IMAP IDLE to alpha15 API"
          git push origin HEAD:agent/epic27-mail-foundation
