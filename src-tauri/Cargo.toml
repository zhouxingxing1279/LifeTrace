[package]
name = "lifetrace"
version = "0.1.0"
description = "LifeTrace local-first desktop application"
authors = ["LifeTrace"]
edition = "2021"

[lib]
name = "lifetrace_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aes-gcm = "0.10"
anyhow = "1.0"
argon2 = "0.5"
async-trait = "0.1"
axum = { version = "0.7", features = ["multipart"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
directories = "5.0"
hex = "0.4"
hmac = "0.12"
http = "1.1"
image = "0.25"
mime_guess = "2.0"
open = "5.3"
password-hash = "0.5"
qrcode = "0.14"
rand = "0.8"
rcgen = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
rustls = "0.23"
rustls-pemfile = "2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
subtle = "2.6"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
thiserror = "2.0"
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "sync", "net", "time", "fs"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
zeroize = "1.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Power", "Win32_System_SystemServices", "Win32_UI_WindowsAndMessaging"] }
