[package]
name = "lifetrace-sync-client"
version = "0.1.0"
edition = "2021"
description = "Platform-independent LifeTrace client synchronization state machine"
license = "MIT"

[lib]
name = "lifetrace_sync_client"

[features]
default = []
testkit = []

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
lifetrace-contracts = { path = "../lifetrace-contracts" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
