[package]
name = "lifetrace-sync-server"
version = "0.1.0"
edition = "2021"
description = "LifeTrace EPIC-03 sync server (Axum prototype; in-memory store with pluggable storage trait)"
license = "MIT"

[dependencies]
axum = { version = "0.8", features = ["json", "macros"] }
chrono = { version = "0.4", features = ["serde"] }
lifetrace-contracts = { path = "../lifetrace-contracts" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "request-id"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
