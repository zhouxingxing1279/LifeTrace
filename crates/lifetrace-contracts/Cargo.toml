[package]
name = "lifetrace-contracts"
version = "0.1.0"
edition = "2021"
description = "LifeTrace public domain contract and sync protocol v1 (wire DTOs, value objects, entity registry, error codes)"
license = "MIT"

[lib]
name = "lifetrace_contracts"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
schemars = { version = "1", features = ["chrono04"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ts-rs = { version = "11", features = ["chrono-impl"] }
